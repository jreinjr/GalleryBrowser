# Builds the web demo from the Carlton branch and deploys it to its own Vercel
# project, so https://gallery-browser-carlton.vercel.app always shows that
# branch. Production (gallery-browser-demo) is still deployed by hand from main.
#
# Needs one repo secret, VERCEL_TOKEN (vercel.com/account/tokens). This file has
# to exist on the Carlton branch itself: GitHub runs the copy in the pushed commit.
name: Carlton preview

on:
  push:
    branches: [Carlton]
  workflow_dispatch:

# Queue rather than cancel: a cancelled build saves no image cache, so pushes
# landing mid-build would keep every run cold. Only the newest queued run is kept.
concurrency:
  group: carlton-preview
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_eoZu8WiKipW0UEWUCvFI0EFO
  VERCEL_PROJECT_ID: prj_AHLKNLpI9aX6vW64KOFLOAaT7QOp

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Fail in seconds on a bad or expired token, not after a half-hour build.
      - name: Check Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      # build.py caches recompressed images here; without it every run redoes them all
      # (~27 min). Saved straight after the build so a failed deploy doesn't lose it.
      - uses: actions/cache/restore@v4
        with:
          path: webdemo/.cache
          key: webdemo-images-${{ github.sha }}
          restore-keys: webdemo-images-

      - run: python webdemo/build.py

      - uses: actions/cache/save@v4
        with:
          path: webdemo/.cache
          key: webdemo-images-${{ github.sha }}-${{ github.run_attempt }}

      # Deploy from outside the checkout. Inside it the CLI attaches the head commit's
      # author, and Vercel blocks a Hobby deployment whose author isn't the account
      # owner: the deploy sits at "Building…" until the job times out.
      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          mv webdemo/dist/gallery-browser-demo "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site"
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
