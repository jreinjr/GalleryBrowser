# Builds the web demo from the Carlton branch and deploys it to its own Vercel
# project, so https://gallery-browser-carlton.vercel.app always shows that
# branch. Production (gallery-browser-demo) is still deployed by hand from main.
#
# Needs one repo secret, VERCEL_TOKEN (vercel.com/account/tokens). This file has
# to exist on the Carlton branch itself: GitHub runs the copy in the pushed commit.
name: Carlton preview

on:
  push:
    branches: [Carlton]
  workflow_dispatch:

concurrency:
  group: carlton-preview
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_eoZu8WiKipW0UEWUCvFI0EFO
  VERCEL_PROJECT_ID: prj_AHLKNLpI9aX6vW64KOFLOAaT7QOp

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      # build.py caches recompressed images here; without it every run redoes them all.
      - uses: actions/cache@v4
        with:
          path: webdemo/.cache
          key: webdemo-images-${{ github.sha }}
          restore-keys: webdemo-images-

      - run: python webdemo/build.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy
        working-directory: webdemo/dist/gallery-browser-demo
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
