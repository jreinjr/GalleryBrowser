<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gallery Ranking Workshop</title>
<style>
/* ---- tokens: dark by default (webdemo house style), light via prefers-color-scheme ---- */
:root {
  color-scheme: dark;
  --bg: #0b0b0c; --surface: #161618; --surface-2: #1e1e21; --surface-3: #26262a;
  --text: #f3f3f1; --text-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
  --accent: #61adf2; --accent-soft: rgba(97,173,242,.16); --on-accent: #0b0b0c;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  /* categorical slots (dataviz reference palette, dark steps, validated on #161618) */
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --div-mid: #383835;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f9f9f7; --surface: #fcfcfb; --surface-2: #f0efec; --surface-3: #e6e5e0;
    --text: #0b0b0b; --text-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
    --accent: #1c6fc4; --accent-soft: rgba(42,120,214,.12); --on-accent: #fff;
    --good: #006300;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
    --div-mid: #f0efec;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 17px; font-weight: 650; margin: 0; }
h2 { font-size: 14px; font-weight: 650; margin: 18px 0 8px; }
h3 { font-size: 13px; font-weight: 650; margin: 14px 0 6px; color: var(--text-2); }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
button { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { background: var(--surface-3); }
button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
button.small { padding: 2px 7px; font-size: 12px; }
button.on { outline: 2px solid var(--accent); }
input, select { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 3px 6px; }
input[type=number] { width: 68px; text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { flex: 1; min-width: 60px; accent-color: var(--accent); padding: 0; background: transparent; border: 0; }
input[type=checkbox] { accent-color: var(--accent); }
.muted { color: var(--muted); }
.dim { color: var(--text-2); }
.num { font-variant-numeric: tabular-nums; }

/* ---- layout ---- */
header.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 18px; padding: 10px 18px; background: var(--bg); border-bottom: 1px solid var(--border); }
header .sub { color: var(--muted); font-size: 12px; margin-left: 10px; }
nav.tabs { display: flex; gap: 4px; }
nav.tabs button { background: transparent; border-color: transparent; color: var(--text-2); padding: 5px 12px; }
nav.tabs button.on { background: var(--accent-soft); color: var(--text); }
.hdr-kpis { margin-left: auto; display: flex; gap: 14px; font-size: 12px; color: var(--text-2); white-space: nowrap; }
.badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid var(--border); }
.badge.ok { background: rgba(12,163,12,.15); color: var(--good); border-color: rgba(12,163,12,.35); }
.badge.bad { background: rgba(208,59,59,.18); color: var(--crit); border-color: rgba(208,59,59,.45); }
.layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 18px; padding: 14px 18px 60px; }
aside#controls { position: sticky; top: 52px; align-self: start; max-height: calc(100vh - 66px); overflow: auto; padding-right: 4px; }
main { min-width: 0; }
.tab { display: none; }
.tab.on { display: block; }
@media (max-width: 1000px) {
  .layout { grid-template-columns: 1fr; }
  aside#controls { position: static; max-height: none; }
  .hdr-kpis { display: none; }
}

/* ---- controls ---- */
details.sec { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
details.sec > summary { cursor: pointer; padding: 7px 10px; font-weight: 600; font-size: 12.5px; list-style: none; display: flex; align-items: center; gap: 6px; }
details.sec > summary::before { content: "▸"; color: var(--muted); font-size: 10px; }
details.sec[open] > summary::before { content: "▾"; }
details.sec > .body { padding: 2px 10px 10px; }
.row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.row label { flex: 0 0 138px; font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
tr.rat td { background: var(--surface-2); }
.flip { color: var(--warn); font-weight: 600; }
.row.wide label { flex: 1 1 auto; }
.row select { flex: 1; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: 0 0 10px; }
.sw.hatch { background-image: repeating-linear-gradient(45deg, var(--c) 0 2px, transparent 2px 4px); background-color: color-mix(in srgb, var(--c) 30%, transparent); }
.hint { font-size: 11px; color: var(--muted); margin: 4px 0 2px; }
table.src { width: 100%; border-collapse: collapse; font-size: 12px; }
table.src td { padding: 2px 3px; border-top: 1px solid var(--border); vertical-align: middle; }
table.src input[type=number] { width: 56px; padding: 1px 4px; }
.srcwrap { max-height: 280px; overflow: auto; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.ovlist { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.ovlist .chip { cursor: pointer; }

/* ---- kpis ---- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; margin: 4px 0 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
.kpi .l { font-size: 11px; color: var(--muted); }
.kpi .v { font-size: 20px; font-weight: 600; line-height: 1.2; }
.kpi .d { font-size: 11px; color: var(--text-2); margin-top: 2px; }

/* ---- ranked list ---- */
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--text-2); margin: 6px 0 10px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; }
.card.feat { border-left: 3px solid var(--accent); }
.card.gated { opacity: .82; }
.card .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card .rank { font-variant-numeric: tabular-nums; color: var(--muted); width: 26px; flex: 0 0 26px; font-size: 12px; }
.card .ttl { font-weight: 600; }
.card .art { color: var(--text-2); }
.card .score { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
.chip { display: inline-block; padding: 0 6px; border-radius: 999px; font-size: 11px; line-height: 17px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); white-space: nowrap; }
.chip.venue { background: var(--surface-3); color: var(--text); }
.chip.f { background: var(--accent-soft); color: var(--text); border-color: transparent; font-weight: 600; }
.chip.warn { color: var(--warn); }
.chip.bad { color: var(--crit); }
.chip.pin { color: var(--accent); }
.chips { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.track { position: relative; height: 12px; background: var(--surface-2); border-radius: 3px; margin: 7px 0 5px 36px; }
.stack { position: absolute; left: 0; top: 0; height: 100%; display: flex; gap: 2px; }
.seg { height: 100%; background: var(--c); cursor: default; }
.seg.hatch { background-image: repeating-linear-gradient(45deg, var(--c) 0 3px, transparent 3px 6px); background-color: color-mix(in srgb, var(--c) 35%, transparent); }
.stack .seg:last-child { border-radius: 0 4px 4px 0; }
.seg:hover { filter: brightness(1.2); }
.thr { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--muted); }
.thr::after { content: "t"; position: absolute; top: -13px; left: -3px; font-size: 9px; color: var(--muted); }
.why { font-size: 12px; color: var(--text-2); margin-left: 36px; }
.lift { font-size: 12px; margin-left: 36px; color: var(--text-2); }
.lift b { color: var(--text); font-weight: 600; }
.card .foot { display: flex; gap: 8px; align-items: center; margin: 4px 0 0 36px; }
.cutoff { display: flex; align-items: center; gap: 10px; margin: 10px 0; color: var(--text-2); font-size: 12px; }
.cutoff::before, .cutoff::after { content: ""; flex: 1; border-top: 2px dashed var(--axis); }
.drawer { margin: 8px 0 2px 36px; padding-top: 8px; border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px 20px; font-size: 12px; }
.drawer h4 { margin: 0 0 4px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
table.t { border-collapse: collapse; width: 100%; font-size: 12px; }
table.t th { text-align: left; font-weight: 600; color: var(--muted); padding: 3px 6px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
table.t td { padding: 3px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; }
table.t tr.hi td { background: var(--accent-soft); }
.scroll { overflow-x: auto; max-width: 100%; }
.sig { padding: 4px 0; border-bottom: 1px solid var(--border); }
.sig .meta { color: var(--muted); font-size: 11px; }
.sig .snip { color: var(--text-2); }
.mini { display: flex; align-items: center; gap: 6px; font-size: 11px; }
.mini .lbl { flex: 0 0 120px; color: var(--text-2); }
.mini .bar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.mini .bar span { display: block; height: 100%; background: var(--s1); border-radius: 0 3px 3px 0; }
.mini .val { width: 22px; text-align: right; font-variant-numeric: tabular-nums; }
.rationale { color: var(--text-2); white-space: pre-wrap; }
.divbar { position: relative; height: 8px; width: 90px; background: var(--surface-2); border-radius: 2px; display: inline-block; vertical-align: middle; margin-right: 6px; }
.divbar::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--axis); }
.divbar span { position: absolute; top: 0; height: 100%; }
.divbar .up { background: var(--s1); left: 50%; border-radius: 0 3px 3px 0; }
.divbar .dn { background: var(--s8); right: 50%; border-radius: 3px 0 0 3px; }
.notice { background: var(--surface); border: 1px dashed var(--axis); border-radius: 8px; padding: 12px 14px; color: var(--text-2); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px 12px; margin-bottom: 14px; }
.panel h2 { margin-top: 2px; }
svg.sweep { width: 100%; height: auto; display: block; }
svg.sweep text { font: 10.5px system-ui, sans-serif; fill: var(--muted); }
svg.sweep .grid { stroke: var(--grid); stroke-width: 1; }
svg.sweep .axis { stroke: var(--axis); stroke-width: 1; }
svg.sweep .l1 { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg.sweep .l2 { fill: none; stroke: var(--s2); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg.sweep .cur { stroke: var(--accent); stroke-width: 1.5; }
svg.sweep .x { stroke: var(--text-2); stroke-width: 1; }
svg.sweep circle { stroke: var(--surface); stroke-width: 2; }
.lk { display: inline-block; width: 14px; height: 2px; vertical-align: middle; border-radius: 1px; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface-3); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 12px; max-width: 320px; white-space: pre-line; box-shadow: 0 4px 16px rgba(0,0,0,.35); }
#tip b { font-weight: 650; }
.slugline { font-size: 11px; color: var(--muted); }
.lint { color: var(--muted); font-size: 11px; }
</style>
</head>

<script>
/* venue_core.js — scoring mirror for the gallery-ranking dashboard (venue_template.html).
 * Inlined by venue_dashboard.inline_core() at the VENUE_CORE marker, inside the page's main
 * <script>. Expects window.VENUES (content/curation/<city>/venues_ranked.json).
 * Section 1: data access + helpers. Section 2: one-to-one mirror of rank_venues.py
 * (computeFeatures / scoreVenue / gateFor / tierFor / rank / auc). No DOM access here. */

/* =====================================================================
 * 1. DATA ACCESS
 * ===================================================================*/
const R = window.VENUES || {};
const VENUES = R.venues || [];
const CITY = R.city || '?';
const BENCH = R.benchmark || { seesaw_venue_ids: [], auc: null };
const SEESAW_IDS = new Set(BENCH.seesaw_venue_ids || []);

// feature order = rank_venues.FEATURES (also the sum order for score)
const FEATURES = ['hours_breadth', 'fairs', 'curated_lists', 'press', 'directory', 'longevity', 'roster_size', 'roster_strength',
  'show_cadence', 'multi_location', 'places_popularity', 'web_presence', 'venue_judge', 'wiki', 'kind_gallery', 'kind_nonprofit', 'kind_museum', 'seesaw_presence'];
const FEATURE_LABEL = { hours_breadth: 'hours breadth', fairs: 'fairs', curated_lists: 'curated lists', press: 'press', directory: 'directories',
  longevity: 'longevity', roster_size: 'roster size', roster_strength: 'roster strength', show_cadence: 'show cadence', multi_location: 'multi-location',
  places_popularity: 'Places popularity', web_presence: 'web presence', venue_judge: 'venue judge', wiki: 'Wikipedia',
  kind_gallery: 'kind: gallery', kind_nonprofit: 'kind: nonprofit', kind_museum: 'kind: museum', seesaw_presence: 'See Saw (leak)' };
// stacked-bar order + palette slot (hue, hatched)
const STACK_ORDER = ['fairs', 'curated_lists', 'press', 'directory', 'venue_judge', 'wiki', 'hours_breadth', 'longevity', 'roster_size', 'show_cadence',
  'multi_location', 'places_popularity', 'web_presence', 'roster_strength', 'kind_gallery', 'kind_nonprofit', 'kind_museum', 'seesaw_presence'];
const FEATURE_SLOT = { fairs: [1, false], curated_lists: [1, true], press: [2, false], directory: [2, true], venue_judge: [3, false], wiki: [3, true],
  hours_breadth: [4, false], longevity: [5, false], roster_size: [6, false], roster_strength: [6, true], show_cadence: [7, false], multi_location: [7, true],
  places_popularity: [8, false], web_presence: [8, true], kind_gallery: [5, true], kind_nonprofit: [5, true], kind_museum: [5, true], seesaw_presence: [2, true] };
const KIND_GROUP = { gallery: 'gallery', nonprofit: 'nonprofit', project_space: 'nonprofit', university: 'nonprofit', museum: 'museum', other: null };
const JUDGE_MODELS = [['sonnet', 'claude-sonnet-5'], ['opus', 'claude-opus-5'], ['mean', 'mean of both'], ['none', 'none (judge off)']];
const JUDGE_MODEL_ID = { sonnet: 'claude-sonnet-5', opus: 'claude-opus-5' };
const APPOINTMENT_ONLY_VALUE = 0.05, FULL_DAYS = 6.0, FULL_HOURS = 42.0;

const $ = (sel, root) => (root || document).querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (x, d) => (x == null || Number.isNaN(+x)) ? '–' : (+x).toFixed(d == null ? 3 : d);
const clone = o => JSON.parse(JSON.stringify(o));
const getPath = (o, p) => p.split('.').reduce((a, k) => (a == null ? undefined : a[k]), o);
function setPath(o, p, v) {
  const ks = p.split('.'); let cur = o;
  for (const k of ks.slice(0, -1)) { if (cur[k] == null || typeof cur[k] !== 'object') cur[k] = {}; cur = cur[k]; }
  cur[ks[ks.length - 1]] = v;
}

/* =====================================================================
 * 2. SCORING MIRROR — one-to-one with scraper/rank_venues.py
 * ===================================================================*/
function sat(n, ref) {
  if (ref == null || +ref <= 0 || n == null || +n <= 0) return 0.0;
  return Math.min(1.0, Math.log2(1 + +n) / Math.log2(1 + +ref));
}

// hours.breadth_value over a parse_hours() result carried in raw.hours
function breadthValue(p) {
  if (!p || !p.parsed) return 0.0;
  const days = p.days_open, hrs = p.hours_per_week;
  if (days === 0) return p.by_appointment ? APPOINTMENT_ONLY_VALUE : 0.0;
  const d = Math.min(1.0, days / FULL_DAYS), h = Math.min(1.0, hrs / FULL_HOURS);
  let value = h > 0 ? Math.sqrt(d * h) : d * 0.5;
  if (p.by_appointment && days <= 2) value = Math.max(value, APPOINTMENT_ONLY_VALUE);
  return Math.round(Math.min(1.0, value) * 10000) / 10000;
}

// rank_venues.compute_features from the embedded raw evidence
function computeFeatures(v, params) {
  const raw = v.raw || {}, refs = params.refs || {}, lw = params.list_weights || {};
  const f = {}, b = {};
  if (raw.hours) {
    f.hours_breadth = breadthValue(raw.hours);
    const hp = raw.hours;
    b.hours_breadth = (hp.days_open === 0 && hp.by_appointment) ? 'by appointment only' : `${hp.days_open} day(s)/wk, ${+hp.hours_per_week} h/wk${hp.by_appointment ? ', +appointment' : ''}`;
  } else if (raw.hours_status === 'appointment_only') { f.hours_breadth = APPOINTMENT_ONLY_VALUE; b.hours_breadth = 'status: appointment_only'; }
  else { f.hours_breadth = 0.0; b.hours_breadth = 'no hours on record'; }
  const fw = (raw.fairs || []).reduce((s, id) => s + (lw[id] != null ? +lw[id] : 1.0), 0);
  f.fairs = sat(fw, refs.fairs ?? 3); b.fairs = (raw.fairs || []).length ? raw.fairs.join(', ') : 'no fair listings';
  const lsw = (raw.lists || []).reduce((s, id) => s + (lw[id] != null ? +lw[id] : 1.0), 0);
  f.curated_lists = sat(lsw, refs.lists ?? 2); b.curated_lists = (raw.lists || []).length ? raw.lists.join(', ') : 'on no curated list';
  f.press = sat((raw.press || []).length, refs.press ?? 3); b.press = (raw.press || []).length ? raw.press.join(', ') : 'no press';
  f.directory = sat((raw.directories || []).length, refs.directory ?? 2); b.directory = (raw.directories || []).length ? raw.directories.join(', ') : 'no directory seed';
  if (raw.years != null) { f.longevity = sat(raw.years, refs.longevity_years ?? 20); b.longevity = `${raw.years} yr(s) (${raw.founded_basis})`; }
  else { f.longevity = 0.0; b.longevity = 'no report'; }
  f.roster_size = sat(raw.roster_count || 0, refs.roster ?? 20); b.roster_size = raw.roster_count != null ? `${raw.roster_count} artists` : 'no report';
  f.roster_strength = 0.0; b.roster_strength = 'artists dataset not built';
  f.show_cadence = sat(raw.exhibitions_per_year || 0, refs.shows_per_year ?? 6); b.show_cadence = raw.exhibitions_per_year != null ? `${+raw.exhibitions_per_year} shows/yr` : 'no report';
  const nl = raw.n_locations || 0;
  f.multi_location = Math.min(1.0, nl / ((+refs.locations || 2) || 1)); b.multi_location = nl ? `${nl} other location(s)` : 'single location / no report';
  if (raw.ratings != null) { const ref = +(refs.ratings ?? 200); f.places_popularity = Math.min(1.0, Math.log10(1 + Math.max(0, raw.ratings)) / Math.log10(1 + ref)); b.places_popularity = `${raw.ratings} Google reviews${raw.rating ? `, ${raw.rating}★` : ''}`; }
  else { f.places_popularity = 0.0; b.places_popularity = 'no Places ratings cached'; }
  const w = raw.web || {};
  f.web_presence = 0.35 * (w.exhibitions_url ? 1 : 0) + 0.35 * (w.dates ? 1 : 0) + 0.30 * (w.about ? 1 : 0);
  const parts = ['exhibitions_url', 'dates', 'about'].filter(k => w[k]);
  b.web_presence = (parts.length ? parts.join(', ') : 'nothing fetched') + (w.fetch_mode && w.fetch_mode !== 'static' ? ` [${w.fetch_mode}]` : '');
  const jcfg = params.judge || {}, variant = jcfg.variant, model = jcfg.model || 'none';
  const jv = ((raw.judge || {})[variant]) || {};
  let vals = [];
  if (model === 'mean') vals = Object.values(jv).map(r => r.overall).filter(x => x != null);
  else if (model !== 'none') { const r = jv[JUDGE_MODEL_ID[model] || model]; if (r && r.overall != null) vals = [r.overall]; }
  if (vals.length) { const m = vals.reduce((a, c) => a + c, 0) / vals.length; f.venue_judge = Math.min(1.0, Math.max(0.0, m / 10.0)); b.venue_judge = `${+m.toFixed(4)}/10 (${variant}/${model})`; }
  else { f.venue_judge = 0.0; b.venue_judge = 'no verdict'; }
  const wk = raw.wiki;
  if (wk && wk.title) { f.wiki = 0.5 + 0.5 * sat(wk.sitelinks || 0, refs.wiki_sitelinks ?? 20); b.wiki = `${wk.title} (${wk.sitelinks || 0} sitelinks)`; }
  else { f.wiki = 0.0; b.wiki = 'no article'; }
  const grp = KIND_GROUP[raw.kind || ''] ?? null;
  for (const g of ['gallery', 'nonprofit', 'museum']) { f['kind_' + g] = grp === g ? 1.0 : 0.0; b['kind_' + g] = raw.kind || '?'; }
  if (params.leak_seesaw) { const ss = raw.seesaw != null ? +raw.seesaw : (SEESAW_IDS.has(v.id) ? 0.5 : 0.0); f.seesaw_presence = ss; b.seesaw_presence = 'LEAKAGE: See Saw presence'; }
  else { f.seesaw_presence = 0.0; b.seesaw_presence = 'off'; }
  return { features: f, basis: b };
}

function scoreVenue(features, params) {
  const weights = params.weights || {};
  const contrib = {}; let score = 0;
  for (const f of FEATURES) { contrib[f] = (+weights[f] || 0) * (+features[f] || 0); score += contrib[f]; }
  return { score, contrib };
}

function gateFor(v, score, params) {
  const g = params.gates || {};
  if ((g.exclude_status || []).includes(v.status)) return `status:${v.status}`;
  if (g.require_verified && v.verification !== 'verified') return 'unverified';
  const kinds = g.kinds || [];
  if (kinds.length && !kinds.includes(v.kind)) return `kind:${v.kind}`;
  if (score < (+g.min_score || 0)) return 'below_min_score';
  return null;
}

function tierFor(score, params) {
  const t = params.tiers || {};
  for (const k of ['1', '2', '3']) { const thr = t[k]; if (thr != null && score >= +thr) return +k; }
  return null;
}

function rank(venuesIn, params) {
  const rows = venuesIn.map(v => {
    const { features, basis } = computeFeatures(v, params);
    const { score, contrib } = scoreVenue(features, params);
    return Object.assign({}, v, { features, basis, score, contrib, gate: gateFor(v, score, params) });
  });
  rows.sort((a, b) => (b.score - a.score) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  let n = 0;
  for (const r of rows) { if (r.gate) { r.tier = null; r.rank = null; } else { n += 1; r.rank = n; r.tier = tierFor(r.score, params); } }
  return rows;
}

function auc(pos, neg) {
  if (!pos.length || !neg.length) return null;
  let wins = 0;
  for (const p of pos) for (const q of neg) wins += p > q ? 1 : p === q ? 0.5 : 0;
  return wins / (pos.length * neg.length);
}

function benchmark(rows) {
  const gated = rows.filter(r => !r.gate);
  const pos = gated.filter(r => SEESAW_IDS.has(r.id)).map(r => r.score);
  const neg = gated.filter(r => !SEESAW_IDS.has(r.id)).map(r => r.score);
  const tiers = {};
  for (const r of gated) if (SEESAW_IDS.has(r.id)) { const k = String(r.tier); tiers[k] = (tiers[k] || 0) + 1; }
  return { n_seesaw: SEESAW_IDS.size, auc: auc(pos, neg), seesaw_tiers: tiers, seesaw_ranks: gated.filter(r => SEESAW_IDS.has(r.id)).map(r => r.rank).sort((a, b) => a - b), pos: pos.length };
}

// Python/JS parity: re-score every venue under params_default and compare with the report
function parityCheck() {
  const p = R.params_default || {};
  let maxScore = 0, maxFeat = 0, worst = null; const rows = [];
  for (const v of VENUES) {
    const { features } = computeFeatures(v, p);
    const { score } = scoreVenue(features, p);
    const ds = Math.abs(score - (v.score || 0));
    let df = 0, dfName = '';
    for (const f of FEATURES) { const d = Math.abs((features[f] || 0) - ((v.features || {})[f] || 0)); if (d > df) { df = d; dfName = f; } }
    rows.push({ id: v.id, js: score, py: v.score, diff: ds, feat_diff: df, feat: dfName });
    if (ds > maxScore) { maxScore = ds; worst = v.id; }
    if (df > maxFeat) maxFeat = df;
  }
  rows.sort((a, b) => b.diff - a.diff);
  return { max_score_diff: maxScore, max_feature_diff: maxFeat, worst, ok: maxScore < 1e-9 && maxFeat < 1e-9, rows: rows.slice(0, 5), n: VENUES.length };
}

/* ---- params helpers (rank_venues.load_params / _merge_params) ---- */
const PARAM_KEY_ORDER = ['version', 'city', 'today', 'weights', 'refs', 'list_weights', 'gates', 'tiers', 'judge', 'leak_seesaw'];
const DEEP_KEYS = new Set(['weights', 'refs', 'list_weights', 'gates', 'tiers', 'judge']);
function normalizeParams(p) {
  p.version = p.version ?? 1; p.city = CITY; p.today = R.today || null;
  for (const k of DEEP_KEYS) if (!p[k] || typeof p[k] !== 'object') p[k] = {};
  for (const f of FEATURES) if (p.weights[f] == null) p.weights[f] = 0;
  if (!Array.isArray(p.gates.kinds)) p.gates.kinds = [];
  if (!Array.isArray(p.gates.exclude_status)) p.gates.exclude_status = [];
  p.leak_seesaw = !!p.leak_seesaw;
  return p;
}
function mergeParams(base, over) {

    if (k.startsWith('_')) continue;
    if (DEEP_KEYS.has(k) && v && typeof v === 'object' && !Array.isArray(v) && base[k] && typeof base[k] === 'object') Object.assign(base[k], v);
    else base[k] = v;
  }
  return base;
}
function orderedParams(p) {
  const out = {};
  for (const k of PARAM_KEY_ORDER) if (k in p) out[k] = p[k];
  for (const k of Object.keys(p)) if (!(k in out) && !k.startsWith('_')) out[k] = p[k];
  return out;
}
// share links: #p=<base64url(JSON diff vs params_default)>
function diffParams(p, base) {
  const out = {};
  for (const k of Object.keys(p)) {
    if (k === 'city' || k === 'today' || k === 'version') continue;
    if (DEEP_KEYS.has(k) && typeof p[k] === 'object' && !Array.isArray(p[k])) {
      const d = {};
      for (const kk of new Set([...Object.keys(p[k]), ...Object.keys((base || {})[k] || {})])) if (JSON.stringify(p[k][kk]) !== JSON.stringify(((base || {})[k] || {})[kk])) d[kk] = p[k][kk];
      if (Object.keys(d).length) out[k] = d;
    } else if (JSON.stringify(p[k]) !== JSON.stringify((base || {})[k])) out[k] = p[k];
  }
  return out;
}
function b64urlEncode(s) { return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64urlDecode(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return decodeURIComponent(escape(atob(s))); }

  for (const r of p.rows) h += `<tr><td><code>${esc(r.id)}</code></td><td class="n">${fmt(r.js, 6)}</td><td class="n">${fmt(r.py, 6)}</td><td class="n">${r.diff.toExponential(2)}</td><td class="n">${r.feat_diff.toExponential(2)}</td><td>${esc(r.feat)}</td></tr>`;
  h += '</table></div></div>';
  h += `<div class="panel"><h2>Reproduce</h2><div class="hint">Export the params and run <code>rank_venues.py score --city ${esc(CITY)} --params &lt;file&gt;</code>; <code>apply</code> writes tier/rank/features to the registry. Share this weighting: <a href="${esc(shareLink())}" id="share-link">link</a> (the <code>#p=</code> suffix is a base64url JSON diff against the defaults).</div></div>`;
  $('#tab-parity').innerHTML = h;
}

// ---- controls ----
function numInput(path, o) { const v = getPath(params, path); return `<input type="number" data-path="${path}" data-kind="${o.int ? 'int' : o.nullable ? 'nullnum' : 'num'}" value="${v == null ? '' : v}"${o.min != null ? ` min="${o.min}"` : ''}${o.max != null ? ` max="${o.max}"` : ''} step="${o.step || 'any'}">`; }
function numRow(label, path, o) { return `<div class="row"><label title="${esc(path)}">${esc(label)}</label>${numInput(path, o)}</div>`; }
function rangeRow(label, path, o, swatch) {
  const v = getPath(params, path); const sw = swatch ? (() => { const [c, h] = slotColor(swatch); return `<i class="sw${h ? ' hatch' : ''}" style="--c:${c};background:${h ? '' : c}"></i>`; })() : '';
  return `<div class="row"><label title="${esc(path)}">${sw}${esc(label)}</label><input type="range" data-path="${path}" data-kind="num" min="${o.min}" max="${o.max}" step="${o.step}" value="${v ?? 0}">${numInput(path, o)}</div>`;
}
function boolRow(label, path) { return `<div class="row wide"><label title="${esc(path)}"><input type="checkbox" data-path="${path}" data-kind="bool"${getPath(params, path) ? ' checked' : ''}> ${esc(label)}</label></div>`; }
function selectRow(label, path, opts) { const v = getPath(params, path); return `<div class="row"><label title="${esc(path)}">${esc(label)}</label><select data-path="${path}" data-kind="str">${opts.map(([val, lab]) => `<option value="${esc(val)}"${String(val) === String(v) ? ' selected' : ''}>${esc(lab)}</option>`).join('')}</select></div>`; }
function section(title, body, open) { return `<details class="sec"${open === false ? '' : ' open'}><summary>${esc(title)}</summary><div class="body">${body}</div></details>`; }
function listRow(label, path, allValues) {
  const cur = new Set(getPath(params, path) || []);
  return `<div class="row wide"><label>${esc(label)}</label></div><div class="ovlist">${allValues.map(k => `<label class="chip"><input type="checkbox" data-list="${path}" data-val="${esc(k)}"${cur.has(k) ? ' checked' : ''}> ${esc(k)}</label>`).join('')}</div>`;
}
function judgeVariants() { const s = new Set([params.judge.variant]); for (const v of VENUES) for (const k of Object.keys((v.raw || {}).judge || {})) s.add(k); return [...s].filter(Boolean); }
function loadPresets() { try { return JSON.parse(localStorage.getItem(PRESET_KEY) || '{}') || {}; } catch (e) { return {}; } }
function savePresets(p) { try { localStorage.setItem(PRESET_KEY, JSON.stringify(p)); } catch (e) { alert('localStorage unavailable: ' + e.message); } }
function presetsHTML() {
  const fileNames = Object.keys(FILE_PRESETS), localNames = Object.keys(loadPresets());
  const opt = (kind, n) => `<option value="${esc(kind + ':' + n)}"${kind === 'file' && FILE_PRESETS[n].note ? ` title="${esc(FILE_PRESETS[n].note)}"` : ''}>${esc(n)}</option>`;
  const groups = (fileNames.length ? `<optgroup label="content/curation/params/">${fileNames.map(n => opt('file', n)).join('')}</optgroup>` : '') + (localNames.length ? `<optgroup label="this browser">${localNames.map(n => opt('local', n)).join('')}</optgroup>` : '');
  return `<div class="row"><select id="preset-sel" style="flex:1">${groups || '<option value="">(no presets)</option>'}</select><button class="small" data-act="preset-load">Load</button><button class="small" data-act="preset-del">Delete</button></div>
  <div class="row"><input type="text" id="preset-name" placeholder="preset name" style="flex:1"><button class="small" data-act="preset-save">Save</button></div>
  <div class="btns"><button class="primary" data-act="export">Export params JSON</button><button class="small" data-act="copy-link">Copy share link</button><label><button class="small" data-act="import-click">Import…</button><input type="file" id="import-file" accept="application/json,.json" hidden></label><button class="small" data-act="reset">Reset to default</button></div>
  <div class="hint">File presets are <code>content/curation/params/venues-*.json</code> embedded at render time. Export writes the rank_venues.py params schema; <code>rank_venues.py apply --params &lt;file&gt;</code> persists a weighting to the registry. Nothing on this page fetches or scrapes.</div>`;
}
const KINDS_ALL = ['gallery', 'museum', 'nonprofit', 'project_space', 'university', 'other'];
const STATUS_ALL = ['active', 'unknown', 'appointment_only', 'candidate', 'closed', 'out_of_scope', 'duplicate'];
function renderControls() {
  let h = '';
  h += section('Gates', boolRow('Require verified (validate_venues.py)', 'gates.require_verified') + numRow('Min score', 'gates.min_score', { min: 0, max: 1, step: 0.01 }) + listRow('Kinds allowed (none = all)', 'gates.kinds', KINDS_ALL) + listRow('Exclude status', 'gates.exclude_status', STATUS_ALL));
  h += section('Tier thresholds', ['1', '2', '3'].map(k => rangeRow(`tier ${k} ≥`, `tiers.${k}`, { min: 0, max: 1, step: 0.01 })).join(''));
  h += section('Feature weights', FEATURES.map(f => rangeRow(FEATURE_LABEL[f], `weights.${f}`, { min: f.startsWith('kind_') ? -1 : 0, max: 1, step: 0.01 }, f)).join('') + '<div class="hint">kind weights may be negative (museums rank as institutions, not galleries)</div>');
  h += section('Saturation references', numRow('fairs (distinct)', 'refs.fairs', { min: 0, step: 0.5 }) + numRow('curated lists', 'refs.lists', { min: 0, step: 0.5 }) + numRow('press outlets', 'refs.press', { min: 0, step: 0.5 }) + numRow('directories', 'refs.directory', { min: 0, step: 0.5 }) + numRow('longevity (years)', 'refs.longevity_years', { min: 0, step: 1 }) + numRow('roster (artists)', 'refs.roster', { min: 0, step: 1 }) + numRow('shows / year', 'refs.shows_per_year', { min: 0, step: 0.5 }) + numRow('other locations', 'refs.locations', { min: 0, step: 1 }) + numRow('Google reviews', 'refs.ratings', { min: 0, step: 50 }) + numRow('wiki sitelinks', 'refs.wiki_sitelinks', { min: 0, step: 1 }), false);
  const listIds = [...new Set(VENUES.flatMap(v => [...((v.raw || {}).fairs || []), ...((v.raw || {}).lists || [])]))].sort();
  h += section(`Fair / list weights (${listIds.length})`, listIds.length ? `<div class="srcwrap"><table class="src">${listIds.map(id => `<tr><td>${esc(id)}</td><td><input type="number" data-lw="${esc(id)}" min="0" max="3" step="0.1" value="${params.list_weights[id] != null ? params.list_weights[id] : 1}"></td></tr>`).join('')}</table></div><div class="hint">Multiplier per fair / curated list before saturation (default 1).</div>` : '<div class="muted">no fair or list signals yet — run the G0 priors sessions</div>', false);
  h += section('Venue judge', selectRow('Variant', 'judge.variant', judgeVariants().map(v => [v, v])) + selectRow('Model', 'judge.model', JUDGE_MODELS) + `<div class="hint">${VENUES.filter(v => Object.keys((v.raw || {}).judge || {}).length).length} of ${VENUES.length} venues have a verdict</div>`, false);
  h += section('Benchmark leakage', boolRow('leak_seesaw (See Saw presence as a feature — experiments only)', 'leak_seesaw'), false);
  h += section('Presets & export', presetsHTML());
  $('#controls').innerHTML = h;
}
function syncInputs(path, except) {
  const v = getPath(params, path);
  document.querySelectorAll(`[data-path="${path}"]`).forEach(el => { if (el === except) return; if (el.type === 'checkbox') el.checked = !!v; else el.value = v == null ? '' : v; });
}
function readInput(el) {
  const kind = el.dataset.kind;
  if (kind === 'bool') return !!el.checked;
  if (kind === 'str') return el.value;
  if (el.value === '' || el.value == null) return kind === 'nullnum' ? null : 0;
  const n = kind === 'int' ? parseInt(el.value, 10) : parseFloat(el.value);
  return Number.isNaN(n) ? (kind === 'nullnum' ? null : 0) : n;
}
function onControlInput(e) {
  const el = e.target;
  if (el.dataset && el.dataset.path) { setPath(params, el.dataset.path, readInput(el)); syncInputs(el.dataset.path, el); renderAll(); }
  else if (el.dataset && el.dataset.list) { const cur = new Set(getPath(params, el.dataset.list) || []); if (el.checked) cur.add(el.dataset.val); else cur.delete(el.dataset.val); setPath(params, el.dataset.list, [...cur]); renderAll(); }
  else if (el.dataset && el.dataset.lw) { const v = parseFloat(el.value); if (Number.isNaN(v) || v === 1) delete params.list_weights[el.dataset.lw]; else params.list_weights[el.dataset.lw] = v; renderAll(); }
}
function exportParams() { return orderedParams(clone(params)); }
function exportParamsJSON() { return JSON.stringify(exportParams(), null, 2); }
function downloadParams() {
  const blob = new Blob([exportParamsJSON()], { type: 'application/json' }); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `venues-${CITY}-${(R.today || 'today')}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function importParams(obj) { params = normalizeParams(mergeParams(normalizeParams(clone(R.params_default || {})), obj)); renderControls(); renderAll(); renderParity(); }
function resetParams() { params = normalizeParams(clone(R.params_default || {})); renderControls(); renderAll(); renderParity(); }
function showTab(name) { ui.tab = name; document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name)); document.querySelectorAll('.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + name)); }
function gotoRow(id) { ui.expanded.add(id); ui.showGated = true; $('#show-gated').checked = true; showTab('ranking'); renderList(); const el = document.getElementById('row-' + id); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) { const t = e.target.closest('nav.tabs button'); if (t) showTab(t.dataset.tab); return; }
  const act = b.dataset.act;
  if (act === 'toggle') { const id = b.dataset.id; if (ui.expanded.has(id)) ui.expanded.delete(id); else ui.expanded.add(id); renderList(); }
  else if (act === 'goto') { e.preventDefault(); gotoRow(b.dataset.id); }
  else if (act === 'export') downloadParams();
  else if (act === 'copy-link') { const l = shareLink(); history.replaceState(null, '', l); (navigator.clipboard ? navigator.clipboard.writeText(l) : Promise.reject()).then(() => { b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy share link'; }, 1500); }, () => prompt('share link', l)); renderParity(); }
  else if (act === 'import-click') $('#import-file').click();
  else if (act === 'reset') resetParams();
  else if (act === 'preset-save') { const name = ($('#preset-name').value || '').trim(); if (!name) { alert('name the preset first'); return; } const p = loadPresets(); p[name] = exportParams(); savePresets(p); $('#controls').querySelector('details.sec:last-of-type .body').innerHTML = presetsHTML(); $('#preset-sel').value = 'local:' + name; }
  else if (act === 'preset-load') { const sel = $('#preset-sel').value; if (!sel) return; const i = sel.indexOf(':'), kind = sel.slice(0, i), name = sel.slice(i + 1); const obj = kind === 'file' ? (FILE_PRESETS[name] || {}).params : loadPresets()[name]; if (obj) importParams(obj); }
  else if (act === 'preset-del') { const sel = $('#preset-sel').value; if (!sel) return; const i = sel.indexOf(':'), kind = sel.slice(0, i), name = sel.slice(i + 1); if (kind === 'file') { alert(`"${name}" is a file preset (${(FILE_PRESETS[name] || {}).file}) — delete it on disk, not here.`); return; } const p = loadPresets(); delete p[name]; savePresets(p); $('#controls').querySelector('details.sec:last-of-type .body').innerHTML = presetsHTML(); }
});
document.addEventListener('input', e => {
  if (e.target.closest('#controls')) onControlInput(e);
  else if (e.target.id === 'filter') { ui.filter = e.target.value; renderList(); }
  else if (e.target.id === 'max-rows') { ui.maxRows = Math.max(10, parseInt(e.target.value, 10) || 150); renderList(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'import-file') { const f = e.target.files && e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { importParams(JSON.parse(rd.result)); } catch (err) { alert('import failed: ' + err.message); } }; rd.readAsText(f); e.target.value = ''; }
  else if (e.target.id === 'show-gated') { ui.showGated = !!e.target.checked; renderList(); }
});
const tipEl = $('#tip');
function showTip(text, e) { tipEl.textContent = text; tipEl.hidden = false; moveTip(e); }
function hideTip() { tipEl.hidden = true; }
function moveTip(e) { const x = Math.min(e.clientX + 14, window.innerWidth - 330), y = e.clientY + 16; tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px'; }
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el.dataset.tip, e); else hideTip(); });
document.addEventListener('mousemove', e => { if (!tipEl.hidden && e.target.closest('[data-tip]')) moveTip(e); });

window.dashboard = {
  get params() { return params; },
  set(path, value) { setPath(params, path, value); syncInputs(path); renderAll(); },
  rows: () => state.rows, bench: () => state.bench, parity: () => state.parity,
  top: (n) => state.rows.filter(r => !r.gate).slice(0, n || 25).map(r => r.id),
  exportJSON: exportParamsJSON, importParams, resetParams, recompute: renderAll, shareLink,
  fn: { computeFeatures, scoreVenue, gateFor, tierFor, rank, auc, benchmark, breadthValue, sat },
};

// boot
readHash();
state.parity = parityCheck();
renderControls();
renderAll();
renderParity();
if (!VENUES.length) $('#list').innerHTML = '<div class="notice">No data: open the generated <code>content/spend/reports/venues-&lt;city&gt;.html</code> (this file is the template).</div>';
</script>
</body>
</html>
