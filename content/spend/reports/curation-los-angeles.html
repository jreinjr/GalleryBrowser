<title>Curation Workshop</title>
<style>
/* ---- tokens: dark by default (webdemo house style), light via prefers-color-scheme ---- */
:root {
  color-scheme: dark;
  --bg: #0b0b0c; --surface: #161618; --surface-2: #1e1e21; --surface-3: #26262a;
  --text: #f3f3f1; --text-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
  --accent: #61adf2; --accent-soft: rgba(97,173,242,.16); --on-accent: #0b0b0c;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  /* categorical slots (dataviz reference palette, dark steps, validated on #161618) */
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --div-mid: #383835;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f9f9f7; --surface: #fcfcfb; --surface-2: #f0efec; --surface-3: #e6e5e0;
    --text: #0b0b0b; --text-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
    --accent: #1c6fc4; --accent-soft: rgba(42,120,214,.12); --on-accent: #fff;
    --good: #006300;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
    --div-mid: #f0efec;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 17px; font-weight: 650; margin: 0; }
h2 { font-size: 14px; font-weight: 650; margin: 18px 0 8px; }
h3 { font-size: 13px; font-weight: 650; margin: 14px 0 6px; color: var(--text-2); }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
button { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { background: var(--surface-3); }
button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
button.small { padding: 2px 7px; font-size: 12px; }
button.on { outline: 2px solid var(--accent); }
input, select { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 3px 6px; }
input[type=number] { width: 68px; text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { flex: 1; min-width: 60px; accent-color: var(--accent); padding: 0; background: transparent; border: 0; }
input[type=checkbox] { accent-color: var(--accent); }
.muted { color: var(--muted); }
.dim { color: var(--text-2); }
.num { font-variant-numeric: tabular-nums; }

/* ---- layout ---- */
header.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 18px; padding: 10px 18px; background: var(--bg); border-bottom: 1px solid var(--border); }
header .sub { color: var(--muted); font-size: 12px; margin-left: 10px; }
nav.tabs { display: flex; gap: 4px; }
nav.tabs button { background: transparent; border-color: transparent; color: var(--text-2); padding: 5px 12px; }
nav.tabs button.on { background: var(--accent-soft); color: var(--text); }
.hdr-kpis { margin-left: auto; display: flex; gap: 14px; font-size: 12px; color: var(--text-2); white-space: nowrap; }
.badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid var(--border); }
.badge.ok { background: rgba(12,163,12,.15); color: var(--good); border-color: rgba(12,163,12,.35); }
.badge.bad { background: rgba(208,59,59,.18); color: var(--crit); border-color: rgba(208,59,59,.45); }
.layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 18px; padding: 14px 18px 60px; }
aside#controls { position: sticky; top: 52px; align-self: start; max-height: calc(100vh - 66px); overflow: auto; padding-right: 4px; }
main { min-width: 0; }
.tab { display: none; }
.tab.on { display: block; }
@media (max-width: 1000px) {
  .layout { grid-template-columns: 1fr; }
  aside#controls { position: static; max-height: none; }
  .hdr-kpis { display: none; }
}

/* ---- controls ---- */
details.sec { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
details.sec > summary { cursor: pointer; padding: 7px 10px; font-weight: 600; font-size: 12.5px; list-style: none; display: flex; align-items: center; gap: 6px; }
details.sec > summary::before { content: "▸"; color: var(--muted); font-size: 10px; }
details.sec[open] > summary::before { content: "▾"; }
details.sec > .body { padding: 2px 10px 10px; }
.row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.row label { flex: 0 0 138px; font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
tr.rat td { background: var(--surface-2); }
.flip { color: var(--warn); font-weight: 600; }
.row.wide label { flex: 1 1 auto; }
.row select { flex: 1; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: 0 0 10px; }
.sw.hatch { background-image: repeating-linear-gradient(45deg, var(--c) 0 2px, transparent 2px 4px); background-color: color-mix(in srgb, var(--c) 30%, transparent); }
.hint { font-size: 11px; color: var(--muted); margin: 4px 0 2px; }
table.src { width: 100%; border-collapse: collapse; font-size: 12px; }
table.src td { padding: 2px 3px; border-top: 1px solid var(--border); vertical-align: middle; }
table.src input[type=number] { width: 56px; padding: 1px 4px; }
.srcwrap { max-height: 280px; overflow: auto; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.ovlist { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.ovlist .chip { cursor: pointer; }

/* ---- kpis ---- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; margin: 4px 0 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
.kpi .l { font-size: 11px; color: var(--muted); }
.kpi .v { font-size: 20px; font-weight: 600; line-height: 1.2; }
.kpi .d { font-size: 11px; color: var(--text-2); margin-top: 2px; }

/* ---- ranked list ---- */
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--text-2); margin: 6px 0 10px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; }
.card.feat { border-left: 3px solid var(--accent); }
.card.gated { opacity: .82; }
.card .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card .rank { font-variant-numeric: tabular-nums; color: var(--muted); width: 26px; flex: 0 0 26px; font-size: 12px; }
.card .ttl { font-weight: 600; }
.card .art { color: var(--text-2); }
.card .score { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
.chip { display: inline-block; padding: 0 6px; border-radius: 999px; font-size: 11px; line-height: 17px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); white-space: nowrap; }
.chip.venue { background: var(--surface-3); color: var(--text); }
.chip.f { background: var(--accent-soft); color: var(--text); border-color: transparent; font-weight: 600; }
.chip.warn { color: var(--warn); }
.chip.bad { color: var(--crit); }
.chip.pin { color: var(--accent); }
.chips { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.track { position: relative; height: 12px; background: var(--surface-2); border-radius: 3px; margin: 7px 0 5px 36px; }
.stack { position: absolute; left: 0; top: 0; height: 100%; display: flex; gap: 2px; }
.seg { height: 100%; background: var(--c); cursor: default; }
.seg.hatch { background-image: repeating-linear-gradient(45deg, var(--c) 0 3px, transparent 3px 6px); background-color: color-mix(in srgb, var(--c) 35%, transparent); }
.stack .seg:last-child { border-radius: 0 4px 4px 0; }
.seg:hover { filter: brightness(1.2); }
.thr { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--muted); }
.thr::after { content: "t"; position: absolute; top: -13px; left: -3px; font-size: 9px; color: var(--muted); }
.why { font-size: 12px; color: var(--text-2); margin-left: 36px; }
.lift { font-size: 12px; margin-left: 36px; color: var(--text-2); }
.lift b { color: var(--text); font-weight: 600; }
.card .foot { display: flex; gap: 8px; align-items: center; margin: 4px 0 0 36px; }
.cutoff { display: flex; align-items: center; gap: 10px; margin: 10px 0; color: var(--text-2); font-size: 12px; }
.cutoff::before, .cutoff::after { content: ""; flex: 1; border-top: 2px dashed var(--axis); }
.drawer { margin: 8px 0 2px 36px; padding-top: 8px; border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px 20px; font-size: 12px; }
.drawer h4 { margin: 0 0 4px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
table.t { border-collapse: collapse; width: 100%; font-size: 12px; }
table.t th { text-align: left; font-weight: 600; color: var(--muted); padding: 3px 6px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
table.t td { padding: 3px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; }
table.t tr.hi td { background: var(--accent-soft); }
.scroll { overflow-x: auto; max-width: 100%; }
.sig { padding: 4px 0; border-bottom: 1px solid var(--border); }
.sig .meta { color: var(--muted); font-size: 11px; }
.sig .snip { color: var(--text-2); }
.mini { display: flex; align-items: center; gap: 6px; font-size: 11px; }
.mini .lbl { flex: 0 0 120px; color: var(--text-2); }
.mini .bar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.mini .bar span { display: block; height: 100%; background: var(--s1); border-radius: 0 3px 3px 0; }
.mini .val { width: 22px; text-align: right; font-variant-numeric: tabular-nums; }
.rationale { color: var(--text-2); white-space: pre-wrap; }
.divbar { position: relative; height: 8px; width: 90px; background: var(--surface-2); border-radius: 2px; display: inline-block; vertical-align: middle; margin-right: 6px; }
.divbar::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--axis); }
.divbar span { position: absolute; top: 0; height: 100%; }
.divbar .up { background: var(--s1); left: 50%; border-radius: 0 3px 3px 0; }
.divbar .dn { background: var(--s8); right: 50%; border-radius: 3px 0 0 3px; }
.notice { background: var(--surface); border: 1px dashed var(--axis); border-radius: 8px; padding: 12px 14px; color: var(--text-2); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px 12px; margin-bottom: 14px; }
.panel h2 { margin-top: 2px; }
svg.sweep { width: 100%; height: auto; display: block; }
svg.sweep text { font: 10.5px system-ui, sans-serif; fill: var(--muted); }
svg.sweep .grid { stroke: var(--grid); stroke-width: 1; }
svg.sweep .axis { stroke: var(--axis); stroke-width: 1; }
svg.sweep .l1 { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg.sweep .l2 { fill: none; stroke: var(--s2); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg.sweep .cur { stroke: var(--accent); stroke-width: 1.5; }
svg.sweep .x { stroke: var(--text-2); stroke-width: 1; }
svg.sweep circle { stroke: var(--surface); stroke-width: 2; }
.lk { display: inline-block; width: 14px; height: 2px; vertical-align: middle; border-radius: 1px; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface-3); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 12px; max-width: 320px; white-space: pre-line; box-shadow: 0 4px 16px rgba(0,0,0,.35); }
#tip b { font-weight: 650; }
.slugline { font-size: 11px; color: var(--muted); }
.lint { color: var(--muted); font-size: 11px; }
</style>
</head>

<script>

function parseISO(s) {
  if (!s || typeof s !== 'string') return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s.trim());
  if (!m) return null;
  const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  if (isNaN(d) || d.getUTCMonth() !== +m[2] - 1 || d.getUTCDate() !== +m[3]) return null;
  return d;
}
const TODAY = parseISO(R.today) || new Date(Date.UTC(new Date().getFullYear(), new Date().getMonth(), new Date().getDate()));
const daysBetween = (a, b) => Math.round((a - b) / 86400000);

const $ = (sel, root) => (root || document).querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (x, d) => (x == null || Number.isNaN(+x)) ? '–' : (+x).toFixed(d == null ? 3 : d);

/* =====================================================================

// decay(age, hl) = 0.5 ** (age / hl); hl <= 0 or null -> 1
function decay(ageDays, halfLife) {
  if (halfLife == null || +halfLife <= 0) return 1.0;
  return Math.pow(0.5, Math.max(0, +ageDays) / +halfLife);
}

// curate.signal_age_days: published_at else ts date; the report's signal view carries that as `date`
function signalAgeDays(sig) {
  const d = parseISO(sig.date) || parseISO(sig.published_at);
  return d ? daysBetween(TODAY, d) : 0;
}

// reads: params.sources[id].{enabled,weight}, sources.json weight/active, params.default_source_weight
function sourceWeight(sig, params) {
  const sid = (sig.source && sig.source.id) || 'unknown';
  const p = (params.sources || {})[sid];
  if (p && Object.keys(p).length) {
    if (p.enabled === false) return 0.0;
    if (p.weight != null) return +p.weight;
  }
  const dflt = +(params.default_source_weight ?? 0.3);
  const src = SOURCE_BY_ID[sid];
  if (src) {
    if (src.active === false) return 0.0;
    return src.weight != null ? +src.weight : dflt;
  }
  return dflt;
}

// reads: params.kind_weights[kind], params.strength_weights[strength] (+ sourceWeight)
function signalWeight(sig, params, halfLife) {
  const kw = +((params.kind_weights || {})[sig.kind] ?? 0);
  const sw = +((params.strength_weights || {})[sig.strength] ?? 0);
  return sourceWeight(sig, params) * kw * sw * decay(signalAgeDays(sig), halfLife);
}

function logSaturate(raw, ref, cap) {
  cap = cap == null ? 1.25 : cap;
  if (ref == null || +ref <= 0) return 0.0;
  return Math.min(cap, Math.log2(1 + Math.max(0, raw)) / Math.log2(1 + +ref));
}

// reads: params.cap_per_source (+ signalWeight keys). Returns {feature, raw, perSource}
function aggregateSignals(signals, kinds, params, halfLife, ref) {
  const per = {};
  for (const s of signals) {
    if (!kinds.has(s.kind)) continue;
    const sid = (s.source && s.source.id) || 'unknown';
    per[sid] = (per[sid] || 0) + signalWeight(s, params, halfLife);
  }
  const cap = +(params.cap_per_source ?? 1.5);
  let raw = 0;
  for (const v of Object.values(per)) raw += Math.min(cap, v);
  return { feature: logSaturate(raw, ref), raw, perSource: per };
}

  const v = show.venue || {};
  const tier = v.tier;
  const map = params.venue_tier_map || {};
  const nFair = new Set((show.signals || []).filter(s => s.kind === 'fair_exhibitor').map(s => (s.source && s.source.id) || 'unknown')).size;
  const isMuseum = !!v.is_museum;
  let value, basis;
  if (tier != null && Object.prototype.hasOwnProperty.call(map, String(tier))) {
    value = +map[String(tier)];
    basis = `tier ${tier}`;
  } else {
    const fallback = 0.4 * nFair + (isMuseum ? 0.3 : 0.0);
    value = Math.min(1.0, Math.max(+(map.unknown ?? 0.2), fallback));
    basis = 'no tier' + (nFair ? `, ${nFair} fair listing(s)` : '') + (isMuseum ? ', museum' : '');
  }
  return [value, { tier, n_fair: nFair, basis, venue_norm: v.norm }];
}

// reads: params.judge.{variant, model in sonnet|opus|mean|none}; show.judge = {variant: {model_id: row}}
function judgeFeature(show, params) {
  const cfg = params.judge || {};
  const variant = cfg.variant, model = cfg.model || 'none';
  if (model === 'none') return [0.0, { model: 'none', rows: {} }];
  const rows = ((show.judge || {})[variant]) || {};
  const picked = {};
  for (const [mid, row] of Object.entries(rows)) {
    if (model === 'mean' || ((model === 'sonnet' || model === 'opus') && mid.toLowerCase().includes(model))) picked[mid] = row;
  }
  const ids = Object.keys(picked);
  if (!ids.length) return [0.0, { model, rows: {}, missing: true }];
  let sum = 0; for (const id of ids) sum += +(picked[id].overall ?? 0);
  const overall = sum / ids.length;
  return [Math.min(1.0, overall / 10.0), { model, rows: Object.fromEntries(ids.map(id => [id, picked[id].overall])) }];
}

// reads: params.wiki_ref; show.wiki = the best-matching wiki row picked in Python
function wikiFeature(show, params) {
  const w = show.wiki || {};
  if (!show.artist || !w.title) return [0.0, { title: null }];
  const ref = +(params.wiki_ref ?? 20000);
  const pv = +(w.pageviews_90d || 0);
  const val = ref > 0 ? 0.3 + 0.7 * Math.min(1.0, Math.log10(1 + pv) / Math.log10(1 + ref)) : 0.3;
  return [val, { title: w.title, pageviews_90d: w.pageviews_90d, url: w.url }];
}

// curation_keywords.keyword_feature: min(1, sum of class weights over distinct classes)
function keywordFeature(hits) {
  const cls = {};
  for (const h of hits || []) cls[h.class] = +h.weight;
  let s = 0; for (const v of Object.values(cls)) s += v;
  return Math.min(1.0, s);
}

// reads: params.half_life_days.{press,artist,opening}, press_ref, artist_ref (+ the helpers above)
function computeFeatures(show, params) {
  const hl = params.half_life_days || {};
  const signals = show.signals || [];
  const press = aggregateSignals(signals, PRESS_KINDS, params, +(hl.press ?? 21), +(params.press_ref ?? 4));
  const heat = aggregateSignals(signals, ARTIST_KINDS, params, +(hl.artist ?? 180), +(params.artist_ref ?? 3));
  const [venue, venueDetail] = venueFeature(show, params);
  const [judge, judgeDetail] = judgeFeature(show, params);
  const [wiki, wikiDetail] = wikiFeature(show, params);
  const hits = show.keyword_hits || [];
  const dso = show.days_since_open, dtc = show.days_to_close;
  let opening;
  if (dso == null) opening = 0.0;
  else if (dso < 0) opening = 1.0;
  else opening = decay(dso, +(hl.opening ?? 30));
  const closing = (dtc != null && dtc >= 0 && dtc <= CLOSING_SOON_DAYS) ? 1.0 : 0.0;
  const nImages = +(show.n_images || 0), descWords = +(show.desc_words || 0);
  const quality = 0.5 * Math.min(1.0, nImages / 5) + 0.5 * Math.min(1.0, descWords / 250);
  const features = {
    press: press.feature, judge, venue, artist_heat: heat.feature,
    museum: (show.venue && show.venue.is_museum) ? 1.0 : 0.0,
    keyword: keywordFeature(hits), wiki_heat: wiki,
    opening_recency: opening, closing_soon: closing, quality,
  };
  const detail = {
    signals, press_raw: press.raw, press_sources: press.perSource, heat_raw: heat.raw, heat_sources: heat.perSource,
    venue: venueDetail, judge: judgeDetail, wiki: wikiDetail, keyword_hits: hits,
    days_since_open: dso, days_to_close: dtc, n_images: nImages, desc_words: descWords,
  };
  return { features, detail };
}

// reads: params.weights[f]. score = Σ weights[f]·feature[f] in FEATURES order; contrib = each term
function scoreShow(features, params) {
  const w = params.weights || {};
  const contrib = {};
  let score = 0;
  for (const f of FEATURES) { contrib[f] = +(w[f] ?? 0) * +(features[f] ?? 0); score += contrib[f]; }
  return { score, contrib };
}

// curate._reasons
function reasonsFor(r, d) {
  const out = [];
  const f = r.features, c = r.contrib;
  const top = FEATURES.filter(k => c[k] > 0).sort((a, b) => c[b] - c[a]).slice(0, 4);
  for (const k of top) {
    if (k === 'press') {
      const sigs = d.signals.filter(s => PRESS_KINDS.has(s.kind));
      const names = [...new Set(sigs.map(s => (s.source && s.source.id) || '?'))].sort();
      out.push(`press ${f.press.toFixed(2)} from ${sigs.length} signal(s): ${names.slice(0, 4).join(', ')}`);
    } else if (k === 'judge') out.push(`judge ${f.judge.toFixed(2)} (${d.judge.model}: ${pyRepr(d.judge.rows)})`);
    else if (k === 'venue') out.push(`venue ${f.venue.toFixed(2)} (${d.venue.basis})`);
    else if (k === 'artist_heat') out.push(`artist heat ${f.artist_heat.toFixed(2)} from ${d.signals.filter(s => ARTIST_KINDS.has(s.kind)).length} signal(s)`);
    else if (k === 'museum') out.push('museum');
    else if (k === 'keyword') out.push('keywords: ' + d.keyword_hits.map(h => h.label).join(', '));
    else if (k === 'wiki_heat') out.push(`wikipedia: ${d.wiki.title} (${d.wiki.pageviews_90d} views/90d)`);
    else if (k === 'opening_recency') { const dd = d.days_since_open; out.push(dd != null && dd < 0 ? `opens in ${-dd} d` : `opened ${dd} d ago`); }
    else if (k === 'closing_soon') out.push(`closes in ${d.days_to_close} d`);
    else if (k === 'quality') out.push(`quality ${f.quality.toFixed(2)} (${d.n_images} images, ${d.desc_words} words)`);
  }
  if (d.judge.missing) out.push('no judge verdict');
  if (!d.signals.length) out.push('no signals');
  if (r.gate) out.push(`gated: ${r.gate_detail || r.gate}`);
  else if (r.pinned) out.push('pinned');
  return out;
}

// curate.apply_gates — reads: overrides.{exclude,pin}, threshold, max_per_venue, max_per_neighborhood,
// max_museum_share, max_n, include_pending, exclude_museums, editors_pick_top. Gate order:
// exclude -> in-window -> threshold -> max_per_venue -> exclude_museums -> max_per_neighborhood
// -> max_museum_share -> (pins first) -> max_n. Pinned rows skip threshold/venue/diversity gates.
function applyGates(rows, params) {
  const ov = params.overrides || {};
  const exclude = new Set(ov.exclude || []);
  const pins = ov.pin || [];
  const threshold = +(params.threshold || 0);
  const maxPerVenue = params.max_per_venue;
  const maxPerNb = params.max_per_neighborhood;
  const share = params.max_museum_share;
  const maxN = params.max_n;
  const nRef = maxN ? maxN : rows.length;
  const museumAllowed = (share != null) ? Math.floor(+share * nRef) : null;
  const seenVenue = {}, seenNb = {};
  let museums = 0;
  const survivors = [];
  for (const r of rows) {
    r.gate = null; r.gate_detail = null;
    r.featured = false; r.editors_pick = false; r.featured_rank = null;
    r.pinned = pins.includes(r.slug);
    const isMuseum = !!r.venue.is_museum;
    const nb = r.venue.neighborhood || '';
    const vn = r.venue.norm;
    if (exclude.has(r.slug)) { r.gate = 'excluded'; r.gate_detail = 'overrides.exclude'; continue; }
    if (!r.in_window && !params.include_pending) { r.gate = 'out_of_window'; r.gate_detail = 'not in the publication window'; continue; }
    if (!r.pinned) {
      if (r.score < threshold) { r.gate = 'below_threshold'; r.gate_detail = `score ${r.score.toFixed(3)} < threshold ${threshold.toFixed(2)}`; continue; }
      if (maxPerVenue && (seenVenue[vn] || 0) >= maxPerVenue) { r.gate = 'max_per_venue'; r.gate_detail = `venue already has ${maxPerVenue}`; continue; }
      if (params.exclude_museums && isMuseum) { r.gate = 'exclude_museums'; r.gate_detail = 'museums excluded'; continue; }
      if (maxPerNb && (seenNb[nb] || 0) >= maxPerNb) { r.gate = 'max_per_neighborhood'; r.gate_detail = `${nb} already has ${maxPerNb}`; continue; }
      if (museumAllowed != null && isMuseum && museums >= museumAllowed) { r.gate = 'max_museum_share'; r.gate_detail = `museum share cap ${share} of ${nRef} = ${museumAllowed}`; continue; }
    }
    seenVenue[vn] = (seenVenue[vn] || 0) + 1;
    seenNb[nb] = (seenNb[nb] || 0) + 1;
    museums += isMuseum ? 1 : 0;
    survivors.push(r);
  }
  let ordered = survivors.filter(r => r.pinned).concat(survivors.filter(r => !r.pinned));
  if (maxN) {
    for (const r of ordered.slice(maxN)) { r.gate = 'max_n'; r.gate_detail = `beyond max_n ${maxN}`; }
    ordered = ordered.slice(0, maxN);
  }
  const topPicks = parseInt(params.editors_pick_top || 0, 10) || 0;
  ordered.forEach((r, i) => { r.featured = true; r.featured_rank = i + 1; r.editors_pick = i < topPicks; });
  return ordered;
}

// curate.rank: score every pool show, sort by (-score, slug), 1-based rank, gate, reasons
function rank(shows, params) {
  const rows = shows.map(show => {
    const { features, detail } = computeFeatures(show, params);
    const { score, contrib } = scoreShow(features, params);
    return Object.assign({}, show, { features, contrib, score, _detail: detail });
  });
  rows.sort((a, b) => (b.score - a.score) || (a.slug < b.slug ? -1 : a.slug > b.slug ? 1 : 0));
  rows.forEach((r, i) => { r.rank = i + 1; });
  applyGates(rows, params);
  for (const r of rows) r.reasons = reasonsFor(r, r._detail);
  return rows;
}

function ndcg(topSlugs, rel) {
  if (!rel.size) return null;
  let dcg = 0; topSlugs.forEach((s, i) => { dcg += (rel.get(s) || 0) / Math.log2(i + 2); });
  const ideal = [...rel.values()].sort((a, b) => b - a).slice(0, Math.max(1, topSlugs.length));
  let idcg = 0; ideal.forEach((v, i) => { idcg += v / Math.log2(i + 2); });
  return idcg ? dcg / idcg : null;
}

// curate.seesaw_metrics over the snapshot entries (matching was done in Python: entries[].match.slug)
function seesawMetrics(rows, entries) {
  if (!entries || !entries.length) return { entries: [], metrics: null, misses: null, top: [] };
  const bySlug = new Map(rows.map(r => [r.slug, r]));
  const top = rows.filter(r => r.featured).sort((a, b) => a.featured_rank - b.featured_rank).map(r => r.slug);
  const topSet = new Set(top);
  const n = entries.length;
  let tp = 0, inPool = 0;
  const rel = new Map();
  const annotated = entries.map(e => {
    const m = e.match || {};
    const row = m.slug ? bySlug.get(m.slug) : null;
    const match = Object.assign({}, m, { rank: row ? row.rank : null, score: row ? row.score : null, featured: !!(row && row.featured), gate: row ? row.gate : null, slug: row ? m.slug : (m.slug || null) });
    if (row) {
      inPool++;
      const pos = (e.position == null) ? n : parseInt(e.position, 10);
      rel.set(m.slug, Math.max(rel.get(m.slug) || 0, n - pos + 1));
      if (topSet.has(m.slug)) tp++;
    }
    return Object.assign({}, e, { match, in_pool: !!row });
  });
  const nTop = top.length;
  const metrics = {
    n_snapshot: n, n_top: nTop, tp,
    precision: nTop ? tp / nTop : null,
    recall: n ? tp / n : null,
    jaccard: (nTop + n - tp) ? tp / (nTop + n - tp) : null,
    pool_coverage: n ? inPool / n : null,
    ranking_recall: inPool ? tp / inPool : null,
    ndcg: ndcg(top, rel),
  };
  const misses = {
    not_in_pool: annotated.filter(e => !e.in_pool),
    in_pool_below_cutoff: annotated.filter(e => e.in_pool && !e.match.featured),
    our_picks_not_on_seesaw: top.filter(s => !rel.has(s)),
  };
  return { entries: annotated, metrics, misses, top, rel };
}

// curate.seesaw_commonality: See Saw-matched in-window shows vs the rest, lift = matched / rest
function commonality(rows, ss) {
  if (!ss || !ss.entries.length) return { n_matched: 0, n_rest: 0, rows: [] };
  const matched = new Set(ss.entries.filter(e => e.in_pool).map(e => e.match.slug));
  const pool = rows.filter(r => r.in_window);
  const a = pool.filter(r => matched.has(r.slug)), b = pool.filter(r => !matched.has(r.slug));
  const vals = (rs, fn) => rs.map(fn).filter(v => v != null);
  const mean = (rs, fn) => { const v = vals(rs, fn); return v.length ? v.reduce((x, y) => x + y, 0) / v.length : null; };
  const median = (rs, fn) => { const v = vals(rs, fn).sort((x, y) => x - y); if (!v.length) return null; const m = v.length >> 1; return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; };
  const share = (rs, fn) => rs.length ? rs.filter(fn).length / rs.length : null;
  const specs = [
    ['museum share', 'share', r => r.venue.is_museum, share],
    ['tier 1 share', 'share', r => r.venue.tier === 1, share],
    ['tier 2 share', 'share', r => r.venue.tier === 2, share],
    ['tier 3 share', 'share', r => r.venue.tier === 3, share],
    ['tier unknown share', 'share', r => r.venue.tier == null, share],
    ['has any signal', 'share', r => (r.signals || []).length > 0, share],
    ['press signals per show', 'mean', r => (r.signals || []).filter(s => PRESS_KINDS.has(s.kind)).length, mean],
    ['press feature', 'mean', r => r.features.press, mean],
    ['artist heat feature', 'mean', r => r.features.artist_heat, mean],
    ['wiki heat feature', 'mean', r => r.features.wiki_heat, mean],
    ['has wikipedia article', 'share', r => !!(r.wiki && r.wiki.title), share],
    ['keyword feature', 'mean', r => r.features.keyword, mean],
    ['judge feature', 'mean', r => r.features.judge, mean],
    ['quality feature', 'mean', r => r.features.quality, mean],
    ['days since opening', 'median', r => r.days_since_open, median],
    ['days to close', 'median', r => r.days_to_close, median],
    ['image count', 'mean', r => r.n_images, mean],
    ['description words', 'mean', r => r.desc_words, mean],
    ['score', 'mean', r => r.score, mean],
  ];
  const out = specs.map(([name, kind, fn, agg]) => {
    const va = agg(a, fn), vb = agg(b, fn);
    return { name, kind, seesaw: va, rest: vb, lift: (va != null && vb != null && vb !== 0) ? va / vb : null };
  });
  const spreadA = a.length ? new Set(a.map(r => r.venue.neighborhood)).size / a.length : null;
  const spreadB = b.length ? new Set(b.map(r => r.venue.neighborhood)).size / b.length : null;
  out.push({ name: 'neighborhood spread (distinct / shows)', kind: 'ratio', seesaw: spreadA, rest: spreadB, lift: (spreadA != null && spreadB) ? spreadA / spreadB : null });
  return { n_matched: a.length, n_rest: b.length, rows: out };
}

// candidates (not in pool): press/artist only, never counted — curate.candidate_rows
function candidateScores(params) {
  const hl = params.half_life_days || {}, w = params.weights || {};
  return CANDIDATES.map(c => {
    const sigs = c.signals || [];
    const press = aggregateSignals(sigs, PRESS_KINDS, params, +(hl.press ?? 21), +(params.press_ref ?? 4)).feature;
    const heat = aggregateSignals(sigs, ARTIST_KINDS, params, +(hl.artist ?? 180), +(params.artist_ref ?? 3)).feature;
    return Object.assign({}, c, { features: { press, artist_heat: heat }, score: +(w.press ?? 0) * press + +(w.artist_heat ?? 0) * heat });
  }).sort((x, y) => (y.score - x.score) || ((y.n_signals || 0) - (x.n_signals || 0)) || (x.key < y.key ? -1 : 1));
}

// precision/recall vs threshold at the current weights (scores fixed; only the gates move)
function sweepData(rows, params, entries) {
  const out = [];
  for (let i = 0; i <= 100; i++) {
    const t = i / 100;
    const rr = rows.map(r => Object.assign({}, r));
    applyGates(rr, Object.assign({}, params, { threshold: t }));
    const m = seesawMetrics(rr, entries).metrics || {};
    out.push({ t, precision: m.precision ?? null, recall: m.recall ?? null, jaccard: m.jaccard ?? null, n_top: rr.filter(r => r.featured).length });
  }
  return out;
}

// Python/JS parity: re-score every show under params_default and compare with the report's numbers
function parityCheck() {
  const p = R.params_default || {};
  let maxScore = 0, maxFeat = 0, worst = null;
  const rows = [];
  for (const s of SHOWS) {
    const { features } = computeFeatures(s, p);
    const { score } = scoreShow(features, p);
    const ds = Math.abs(score - (s.score || 0));
    let df = 0, dfName = '';
    for (const f of FEATURES) { const d = Math.abs(features[f] - ((s.features || {})[f] || 0)); if (d > df) { df = d; dfName = f; } }
    rows.push({ slug: s.slug, js: score, py: s.score, diff: ds, feat_diff: df, feat: dfName });
    if (ds > maxScore) { maxScore = ds; worst = s.slug; }
    if (df > maxFeat) maxFeat = df;
  }
  rows.sort((a, b) => b.diff - a.diff);
  return { max_score_diff: maxScore, max_feature_diff: maxFeat, worst, ok: maxScore < 1e-9 && maxFeat < 1e-9, rows: rows.slice(0, 5), n: SHOWS.length };
}

/* =====================================================================
 * 3. STATE + RENDERING
 * ===================================================================*/
const PARAM_KEY_ORDER = ['version', 'city', 'today', 'max_n', 'threshold', 'max_per_venue', 'include_pending', 'editors_pick_top',
  'exclude_museums', 'max_per_neighborhood', 'max_museum_share', 'weights', 'half_life_days', 'press_ref', 'artist_ref',
  'cap_per_source', 'wiki_ref', 'default_source_weight', 'kind_weights', 'strength_weights', 'sources', 'venue_tier_map', 'judge', 'overrides'];

function normalizeParams(p) {
  p.version = p.version ?? 1; p.city = CITY; p.today = R.today || null;
  for (const k of ['weights', 'half_life_days', 'kind_weights', 'strength_weights', 'venue_tier_map', 'judge', 'sources']) if (!p[k] || typeof p[k] !== 'object') p[k] = {};
  if (!p.overrides || typeof p.overrides !== 'object') p.overrides = {};
  p.overrides.pin = Array.isArray(p.overrides.pin) ? p.overrides.pin : [];
  p.overrides.exclude = Array.isArray(p.overrides.exclude) ? p.overrides.exclude : [];
  for (const f of FEATURES) if (p.weights[f] == null) p.weights[f] = 0;
  return p;
}
function mergeParams(base, over) {   // curate._merge_params: dict-valued keys merged per key
  const deep = new Set(['weights', 'half_life_days', 'kind_weights', 'strength_weights', 'venue_tier_map', 'judge', 'overrides']);
  for (const [k, v] of Object.entries(over || {})) {
    if (deep.has(k) && v && typeof v === 'object' && !Array.isArray(v) && base[k] && typeof base[k] === 'object') Object.assign(base[k], v);
    else base[k] = v;
  }
  return base;
}
function orderedParams(p) {
  const out = {};
  for (const k of PARAM_KEY_ORDER) if (k in p) out[k] = p[k];
  for (const k of Object.keys(p)) if (!(k in out) && !k.startsWith('_')) out[k] = p[k];
  return out;
}

let params = normalizeParams(clone(R.params_default || {}));
const ui = { tab: 'ranking', hideCandidates: false, expanded: new Set(), snapshot: SEESAW.snapshot_id || null };
const state = { rows: [], ss: null, common: null, sweep: [], parity: null, cands: [] };
const PRESET_KEY = 'curation-presets:' + CITY;

function currentEntries() { return (ui.snapshot && ui.snapshot === SEESAW.snapshot_id) ? (SEESAW.entries || []) : []; }

function recompute() {
  state.rows = rank(SHOWS, params);
  state.ss = seesawMetrics(state.rows, currentEntries());
  state.common = commonality(state.rows, state.ss);
  state.sweep = currentEntries().length ? sweepData(state.rows, params, currentEntries()) : [];
  state.cands = candidateScores(params);
}
function renderAll() {
  recompute();
  renderHeader(); renderKPIs(); renderLegend(); renderList(); renderCandidates(); renderBenchmark();
}

// ---- helpers for rows ----
function cutoffInfo() {
  const feat = state.rows.filter(r => r.featured);
  if (!feat.length) return { row: null, score: +(params.threshold || 0), n: 0 };
  const row = feat.reduce((m, r) => (r.score < m.score ? r : m), feat[0]);
  return { row, score: row.score, n: feat.length };
}
// "what would lift it": gap to the cutoff show + the two features where this show lags it most
function liftHint(r) {
  const c = cutoffInfo();
  const w = params.weights || {};
  let gap, lags, basis;
  if (c.row && c.row.slug !== r.slug) {
    gap = c.row.score - r.score; basis = `cutoff show #${c.row.rank}`;
    lags = FEATURES.map(f => [f, c.row.contrib[f] - r.contrib[f]]).filter(x => x[1] > 1e-12).sort((a, b) => b[1] - a[1]).slice(0, 2);
  } else {
    gap = +(params.threshold || 0) - r.score; basis = 'threshold';
    lags = FEATURES.map(f => [f, +(w[f] ?? 0) * ((FEATURE_CAP[f] || 1) - r.features[f])]).filter(x => x[1] > 1e-12).sort((a, b) => b[1] - a[1]).slice(0, 2);
  }
  return { gap, lags, basis };
}
function liftHTML(r) {
  if (!r.gate || r.gate === 'excluded' || r.gate === 'out_of_window') return '';
  const { gap, lags, basis } = liftHint(r);
  if (gap <= 0) return `<div class="lift">above the cutoff score but gated: <b>${esc(r.gate_detail || r.gate)}</b></div>`;
  const lift = lags.length ? lags.map(([f, d]) => `${FEATURE_LABEL[f]} +${d.toFixed(2)}`).join(', ') : 'no single feature closes it';
  return `<div class="lift">gap to ${esc(basis)}: <b>${gap.toFixed(3)}</b> · what would lift it: <b>${esc(lift)}</b></div>`;
}
function chipsHTML(r) {
  const c = [];
  if (r.featured) c.push(`<span class="chip f">F${r.featured_rank}${r.editors_pick ? " · editors' pick" : ''}</span>`);
  if (r.pinned) c.push('<span class="chip pin">pinned</span>');

  const W = 640, H = 200, L = 34, Rm = 12, T = 12, B = 26;
  const x = t => L + t * (W - L - Rm), y = v => T + (1 - v) * (H - T - B);
  hit.addEventListener('mousemove', e => {
    const bb = svg.getBoundingClientRect();
    const t = Math.max(0, Math.min(1, ((e.clientX - bb.left) / bb.width * W - L) / (W - L - Rm)));
    const p = state.sweep[Math.round(t * 100)];
    if (!p) return;
    hov.innerHTML = `<line class="x" x1="${x(p.t)}" x2="${x(p.t)}" y1="${T}" y2="${H - B}"/>` + (p.precision == null ? '' : `<circle cx="${x(p.t)}" cy="${y(p.precision)}" r="4" fill="var(--s1)"/>`) + (p.recall == null ? '' : `<circle cx="${x(p.t)}" cy="${y(p.recall)}" r="4" fill="var(--s2)"/>`);
    showTip(`threshold ${p.t.toFixed(2)} · ${p.n_top} featured\nprecision ${fmt(p.precision, 2)} · recall ${fmt(p.recall, 2)} · jaccard ${fmt(p.jaccard, 2)}`, e);
  });
  hit.addEventListener('mouseleave', () => { hov.innerHTML = ''; hideTip(); });
  hit.addEventListener('click', e => {
    const bb = svg.getBoundingClientRect();
    const t = Math.max(0, Math.min(1, ((e.clientX - bb.left) / bb.width * W - L) / (W - L - Rm)));
    params.threshold = Math.round(t * 100) / 100; syncInputs('threshold'); renderAll();
  });
}

// ---- judge tab ----
function judgeCell(v) {
  if (v == null) return '<span class="muted">–</span>';
  if (typeof v === 'boolean') return v ? '✓' : '–';
  if (typeof v === 'number') return `<span class="num">${Number.isInteger(v) ? v : fmt(v, 3)}</span>`;
  if (Array.isArray(v)) return esc(v.map(x => (typeof x === 'object' ? JSON.stringify(x) : x)).join(', '));
  if (typeof v === 'object') {
    const vals = Object.values(v);
    if (vals.length && vals.every(x => typeof x === 'number')) return miniBars(v);
    return `<code>${esc(JSON.stringify(v))}</code>`;
  }
  const s = String(v);
  return s.length > 60 ? `<div class="rationale" style="min-width:260px">${esc(s)}</div>` : esc(s);
}
function judgeTable(rows) {
  if (!Array.isArray(rows) || !rows.length) return '<div class="muted">empty</div>';
  const cols = []; for (const r of rows) for (const k of Object.keys(r)) if (!cols.includes(k)) cols.push(k);
  let h = '<div class="scroll"><table class="t"><tr>' + cols.map(c => `<th>${esc(c)}</th>`).join('') + '</tr>';
  for (const r of rows) h += '<tr>' + cols.map(c => `<td>${c === 'slug' && r[c] ? `<a href="#row-${esc(r[c])}" data-act="goto" data-slug="${esc(r[c])}"><code>${esc(r[c])}</code></a>` : judgeCell(r[c])}</td>`).join('') + '</tr>';
  return h + '</table></div>';
}
// judge.py compare shape: {variant, n, spearman, mean_abs_delta, precision_at_n{sonnet,opus,mean}, overlap{},
//   cost_per_verdict{}, total_cost_compared, suggestion, suggestion_basis, n_top, snapshot_id, top[], all[]}
// rows: {slug, title, artist, venue, sonnet{scores,overall,confidence,rationale,red_flags,cost_usd}, opus{…},
//   delta, max_sub_delta, membership{sonnet,opus,mean}, membership_flip, on_seesaw, seesaw_flip, rank{…}, cutoff_proximity, relevance}
function verdictCell(v) {
  if (!v) return '<span class="muted">no verdict</span>';
  return `<div><b>${esc(v.overall)}</b><span class="muted">/10 · conf ${fmt(v.confidence, 2)}${v.cost_usd != null ? ` · $${fmt(v.cost_usd, 4)}` : ''}</span></div>${miniBars(v.scores)}`;
}
function triCell(o, fmtFn) {
  if (!o || typeof o !== 'object') return '<span class="muted">–</span>';
  return ['sonnet', 'opus', 'mean'].map(k => `<span class="muted">${k[0].toUpperCase()}</span> ${fmtFn(o[k])}`).join(' · ');
}
const yesNo = v => v === true ? '✓' : (v === false ? '–' : esc(v ?? '–'));
function judgeSpecific(jc) {
  const p = jc.precision_at_n || {}, ov = jc.overlap || {}, cpv = jc.cost_per_verdict || {};
  let h = '<div class="kpis">' + kpi('Shows compared', esc(jc.n ?? '–'), `${esc(jc.variant || '')} · snapshot ${esc(jc.snapshot_id || '–')} · params ${esc(jc.params_hash || '')}`) +
    kpi('Spearman ρ', fmt(jc.spearman, 2), 'rank agreement, sonnet vs opus') + kpi('Mean |Δ|', fmt(jc.mean_abs_delta, 2), 'opus − sonnet overall, /10') +
    kpi('Precision@N', `<span style="font-size:15px">${fmt(p.sonnet, 2)} / ${fmt(p.opus, 2)} / ${fmt(p.mean, 2)}</span>`, `sonnet / opus / mean vs See Saw, top ${esc(jc.n_top ?? '')}`) +
    kpi('Top-N overlap', `<span style="font-size:15px">${esc(ov.sonnet ?? '–')} / ${esc(ov.opus ?? '–')} / ${esc(ov.mean ?? '–')}</span>`, 'sonnet / opus / mean') +
    kpi('$ / verdict', `<span style="font-size:15px">${fmt(cpv.sonnet, 3)} / ${fmt(cpv.opus, 3)}</span>`, `sonnet / opus · $${fmt(jc.total_cost_compared, 3)} compared, $${fmt(jc.total_cost_variant, 3)} variant total`) +
    kpi('Auto-suggestion', `<span style="font-size:15px">${esc(jc.suggestion || '–')}</span>`, esc(jc.suggestion_basis || '') + ' · starting point only; read the rationales') + '</div>';
  if (R.judge_compare_source) h += `<div class="hint">embedded from <code>${esc(R.judge_compare_source)}</code> · generated ${esc(jc.generated_at || '')}</div>`;
  const top = jc.top || [];
  h += `<div class="panel"><h2>Top ${top.length} decision-relevant comparisons</h2><div class="hint">relevance = |Δ| + 3·membership flip + 4·See Saw flip + 0.5·max sub-score Δ + 0.5·cutoff proximity. Rows with a flip are highlighted; rationales side by side underneath.</div><div class="scroll"><table class="t"><tr><th class="n">#</th><th>show</th><th>claude-sonnet-5</th><th>claude-opus-5</th><th class="n">Δ overall</th><th class="n">max sub Δ</th><th>in top-N</th><th>rank</th><th>See Saw</th><th class="n">cutoff prox.</th><th class="n">relevance</th></tr>`;
  top.forEach((r, i) => {
    const flip = r.membership_flip || r.seesaw_flip;
    h += `<tr class="${flip ? 'hi' : ''}"><td class="n">${i + 1}</td><td><a href="#row-${esc(r.slug)}" data-act="goto" data-slug="${esc(r.slug)}"><b>${esc(r.title || r.slug)}</b></a><div class="muted">${esc(r.artist || '')}${r.artist ? ' · ' : ''}${esc(r.venue || '')}</div><div class="slugline"><code>${esc(r.slug)}</code></div></td><td>${verdictCell(r.sonnet)}</td><td>${verdictCell(r.opus)}</td><td class="n">${r.delta > 0 ? '+' : ''}${esc(r.delta ?? '–')}</td><td class="n">${esc(r.max_sub_delta ?? '–')}</td><td>${triCell(r.membership, yesNo)}${r.membership_flip ? ' <span class="flip">flip</span>' : ''}</td><td>${triCell(r.rank, v => esc(v ?? '–'))}</td><td>${yesNo(r.on_seesaw)}${r.seesaw_flip ? ' <span class="flip">flip</span>' : ''}</td><td class="n">${fmt(r.cutoff_proximity, 3)}</td><td class="n">${fmt(r.relevance, 2)}</td></tr>`;
    const rat = v => v ? `<div class="rationale">${esc(v.rationale || '')}</div>${v.red_flags && v.red_flags.length ? `<div class="muted">red flags: ${esc(v.red_flags.join('; '))}</div>` : ''}` : '<span class="muted">–</span>';
    h += `<tr class="rat"><td></td><td colspan="10"><div class="two"><div><h4 style="margin:0 0 3px;font-size:11px;color:var(--muted)">SONNET</h4>${rat(r.sonnet)}</div><div><h4 style="margin:0 0 3px;font-size:11px;color:var(--muted)">OPUS</h4>${rat(r.opus)}</div></div></td></tr>`;
  });
  h += '</table></div></div>';
  const all = jc.all || [];
  h += `<div class="panel"><h2>Full agreement table (${all.length})</h2><div class="scroll"><table class="t"><tr><th>slug</th><th class="n">sonnet</th><th class="n">opus</th><th class="n">Δ</th><th class="n">max sub Δ</th><th>in top-N (S/O/M)</th><th>rank (S/O/M)</th><th>See Saw</th><th class="n">relevance</th></tr>`;
  for (const r of all) h += `<tr class="${r.membership_flip || r.seesaw_flip ? 'hi' : ''}"><td><a href="#row-${esc(r.slug)}" data-act="goto" data-slug="${esc(r.slug)}"><code>${esc(r.slug)}</code></a></td><td class="n">${esc(r.sonnet ? r.sonnet.overall : '–')}</td><td class="n">${esc(r.opus ? r.opus.overall : '–')}</td><td class="n">${r.delta > 0 ? '+' : ''}${esc(r.delta ?? '–')}</td><td class="n">${esc(r.max_sub_delta ?? '–')}</td><td>${triCell(r.membership, yesNo)}${r.membership_flip ? ' <span class="flip">flip</span>' : ''}</td><td>${triCell(r.rank, v => esc(v ?? '–'))}</td><td>${yesNo(r.on_seesaw)}${r.seesaw_flip ? ' <span class="flip">flip</span>' : ''}</td><td class="n">${fmt(r.relevance, 2)}</td></tr>`;
  h += '</table></div></div>';
  return h;
}
function renderJudge() {
  const el = $('#tab-judge');

  if (!jc || !Object.keys(jc).length) {
    el.innerHTML = `<div class="notice"><b>No judge comparison yet.</b><br>Generate it with<br><code>scraper/.venv/bin/python scraper/judge.py run --city ${esc(CITY)} --models claude-sonnet-5,claude-opus-5</code><br><code>scraper/.venv/bin/python scraper/judge.py compare --city ${esc(CITY)}</code><br>then <code>curate.py score --city ${esc(CITY)}</code> and <code>curation_dashboard.py --city ${esc(CITY)}</code>. The dashboard embeds <code>content/curation/${esc(CITY)}/judge_compare.json</code> automatically when it exists.</div>`;
    return;
  }
  let h = '';
  const scalars = {};
  const summary = jc.summary || jc.header || jc.stats || {};
  for (const [k, v] of Object.entries(Object.assign({}, jc, summary))) if (v == null || ['number', 'string', 'boolean'].includes(typeof v)) scalars[k] = v;
  if (Object.keys(scalars).length) h += '<div class="kpis">' + Object.entries(scalars).map(([k, v]) => kpi(k.replace(/_/g, ' '), typeof v === 'number' ? fmt(v, 3) : `<span style="font-size:13px">${esc(String(v))}</span>`)).join('') + '</div>';
  if (R.judge_compare_source) h += `<div class="hint">embedded from <code>${esc(R.judge_compare_source)}</code></div>`;
  const top = jc.top || jc.top10 || jc.top_rows || jc.decision_relevant || (Array.isArray(jc.rows) ? jc.rows.slice(0, 10) : null);
  const all = jc.rows || jc.all || jc.agreement || jc.shows || jc.per_show;
  if (jc.recommendation || jc.suggestion) h += `<div class="panel"><h2>Recommendation</h2><div class="rationale">${esc(jc.recommendation || jc.suggestion)}</div></div>`;
  if (top) h += `<div class="panel"><h2>Top ${top.length} decision-relevant comparisons</h2>${judgeTable(top)}</div>`;
  if (all && all !== top) h += `<div class="panel"><h2>Full agreement table (${all.length})</h2>${judgeTable(all)}</div>`;
  for (const [k, v] of Object.entries(jc)) if (Array.isArray(v) && v !== top && v !== all && v.length && typeof v[0] === 'object') h += `<div class="panel"><h2>${esc(k)}</h2>${judgeTable(v)}</div>`;
  el.innerHTML = h || '<div class="notice">judge_compare present but empty.</div>';
}

  h += section('Signal kind weights', Object.keys(params.kind_weights).map(k => rangeRow(k.replace(/_/g, ' '), `kind_weights.${k}`, { min: 0, max: 2, step: 0.05 })).join('') + '<div class="hint" style="margin-top:6px">strength</div>' + Object.keys(params.strength_weights).map(k => rangeRow(k, `strength_weights.${k}`, { min: 0, max: 1, step: 0.05 })).join(''), false);
  h += section('Half-lives & references', numRow('Press half-life (d)', 'half_life_days.press', { min: 0, step: 1 }) + numRow('Artist half-life (d)', 'half_life_days.artist', { min: 0, step: 1 }) + numRow('Opening half-life (d)', 'half_life_days.opening', { min: 0, step: 1 }) +
    numRow('press_ref', 'press_ref', { min: 0, step: 0.5 }) + numRow('artist_ref', 'artist_ref', { min: 0, step: 0.5 }) + numRow('cap_per_source', 'cap_per_source', { min: 0, step: 0.1 }) + numRow('wiki_ref (views/90d)', 'wiki_ref', { min: 0, step: 1000 }) + numRow('default source weight', 'default_source_weight', { min: 0, max: 1, step: 0.05 }), false);
  h += section('Venue tier map', Object.keys(params.venue_tier_map).map(k => rangeRow(k === 'unknown' ? 'unknown / no tier' : `tier ${k}`, `venue_tier_map.${k}`, { min: 0, max: 1, step: 0.05 })).join('') + `<div class="hint">registry ${R.venue_registry_present ? 'present' : 'absent'} · ${SHOWS.filter(s => s.venue && s.venue.tier != null).length} shows have a tier; the rest use the unknown value (or fair listings / museum fallback)</div>`, false);
  let srcRows = '';
  for (const s of SOURCES) { const e = effSource(s.id); srcRows += `<tr><td><input type="checkbox" data-src="${esc(s.id)}" data-field="enabled"${e.enabled ? ' checked' : ''}></td><td title="${esc(s.name)} · ${esc(s.kind)}">${esc(s.id)}<div class="lint">${esc(s.kind || '')}${s.active === false ? ' · inactive' : ''}</div></td><td><input type="number" data-src="${esc(s.id)}" data-field="weight" min="0" max="2" step="0.05" value="${e.weight}"></td></tr>`; }
  h += section(`Sources (${SOURCES.length})`, `<div class="srcwrap"><table class="src">${srcRows || '<tr><td class="muted">no sources.json</td></tr>'}</table></div><div class="hint">Unchecked = weight 0. Changed rows are exported as <code>params.sources[id]</code>.</div>`, false);
  h += section('Overrides', `<div id="overrides">${overridesHTML()}</div>`);
  h += section('Presets & export', presetsHTML());
  $('#controls').innerHTML = h;
}
function syncInputs(path, except) {
  const v = getPath(params, path);
  document.querySelectorAll(`[data-path="${path}"]`).forEach(el => {
    if (el === except) return;
    if (el.type === 'checkbox') el.checked = !!v;
    else el.value = v == null ? '' : v;
  });
}
function readInput(el) {
  const kind = el.dataset.kind;
  if (kind === 'bool') return !!el.checked;
  if (kind === 'str') return el.value;
  if (el.value === '' || el.value == null) return kind === 'nullnum' ? null : 0;
  const n = kind === 'int' ? parseInt(el.value, 10) : parseFloat(el.value);
  return Number.isNaN(n) ? (kind === 'nullnum' ? null : 0) : n;
}
function onControlInput(e) {
  const el = e.target;
  if (el.dataset && el.dataset.path) {
    setPath(params, el.dataset.path, readInput(el));
    syncInputs(el.dataset.path, el);
    renderAll();
  } else if (el.dataset && el.dataset.src) {
    const id = el.dataset.src;
    const cur = effSource(id);
    params.sources[id] = { enabled: cur.enabled, weight: cur.weight };
    if (el.dataset.field === 'enabled') params.sources[id].enabled = !!el.checked;
    else params.sources[id].weight = parseFloat(el.value) || 0;
    renderAll();
  } else if (el.id === 'hide-cands') {
    ui.hideCandidates = !!el.checked; renderCandidates();
  }
}

// ---- presets / export / import ----
function loadPresets() { try { return JSON.parse(localStorage.getItem(PRESET_KEY) || '{}') || {}; } catch (e) { return {}; } }
function savePresets(p) { try { localStorage.setItem(PRESET_KEY, JSON.stringify(p)); } catch (e) { alert('localStorage unavailable: ' + e.message); } }
function exportParams() { return orderedParams(clone(params)); }
function exportParamsJSON() { return JSON.stringify(exportParams(), null, 2); }
function downloadParams() {
  const blob = new Blob([exportParamsJSON()], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `params-${CITY}-${(R.today || 'today')}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function importParams(obj) {
  params = normalizeParams(mergeParams(normalizeParams(clone(R.params_default || {})), obj));
  renderControls(); renderAll();
}
function resetParams() { params = normalizeParams(clone(R.params_default || {})); renderControls(); renderAll(); }

// ---- global wiring ----
function toggleOverride(kind, slug) {
  const list = params.overrides[kind];
  const i = list.indexOf(slug);
  if (i >= 0) list.splice(i, 1); else list.push(slug);
  if (kind === 'pin') { const j = params.overrides.exclude.indexOf(slug); if (i < 0 && j >= 0) params.overrides.exclude.splice(j, 1); }
  if (kind === 'exclude') { const j = params.overrides.pin.indexOf(slug); if (i < 0 && j >= 0) params.overrides.pin.splice(j, 1); }
  $('#overrides').innerHTML = overridesHTML();
  renderAll();
}
function gotoRow(slug) {
  ui.expanded.add(slug);
  showTab('ranking'); renderList();
  const el = document.getElementById('row-' + slug); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function showTab(name) {
  ui.tab = name;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  document.querySelectorAll('.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + name));
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) { const t = e.target.closest('nav.tabs button'); if (t) showTab(t.dataset.tab); return; }
  const act = b.dataset.act;
  if (act === 'toggle') { const s = b.dataset.slug; if (ui.expanded.has(s)) ui.expanded.delete(s); else ui.expanded.add(s); renderList(); }
  else if (act === 'pin' || act === 'exclude') toggleOverride(act, b.dataset.slug);
  else if (act === 'rm-override') toggleOverride(b.dataset.kind, b.dataset.slug);
  else if (act === 'goto') { e.preventDefault(); gotoRow(b.dataset.slug); }
  else if (act === 'goto-cand') { e.preventDefault(); ui.hideCandidates = false; const cb = $('#hide-cands'); if (cb) cb.checked = false; showTab('ranking'); renderCandidates(); const el = document.getElementById('cand-' + b.dataset.key); if (el) el.scrollIntoView({ block: 'center' }); }
  else if (act === 'export') downloadParams();
  else if (act === 'import-click') $('#import-file').click();
  else if (act === 'reset') resetParams();
  else if (act === 'preset-save') { const name = ($('#preset-name').value || '').trim(); if (!name) { alert('name the preset first'); return; } const p = loadPresets(); p[name] = exportParams(); savePresets(p); $('#controls').querySelector('details.sec:last-of-type .body').innerHTML = presetsHTML(); $('#preset-sel').value = name; }
  else if (act === 'preset-load') { const name = $('#preset-sel').value; const p = loadPresets(); if (p[name]) importParams(p[name]); }
  else if (act === 'preset-del') { const name = $('#preset-sel').value; const p = loadPresets(); delete p[name]; savePresets(p); $('#controls').querySelector('details.sec:last-of-type .body').innerHTML = presetsHTML(); }
});
document.addEventListener('input', e => { if (e.target.closest('#controls')) onControlInput(e); });
document.addEventListener('change', e => {
  if (e.target.id === 'import-file') {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { importParams(JSON.parse(rd.result)); } catch (err) { alert('import failed: ' + err.message); } };
    rd.readAsText(f); e.target.value = '';
  } else if (e.target.id === 'snap-sel') { ui.snapshot = e.target.value || null; renderAll(); }
  else if (e.target.closest('#controls') && (e.target.type === 'checkbox' || e.target.tagName === 'SELECT')) { /* input already handled */ }
});

// tooltip
const tipEl = $('#tip');
function showTip(text, e) { tipEl.textContent = text; tipEl.hidden = false; moveTip(e); }
function hideTip() { tipEl.hidden = true; }
function moveTip(e) { const x = Math.min(e.clientX + 14, window.innerWidth - 330), y = e.clientY + 16; tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px'; }
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el.dataset.tip, e); else if (!e.target.closest('#sweep')) hideTip(); });
document.addEventListener('mousemove', e => { if (!tipEl.hidden && e.target.closest('[data-tip]')) moveTip(e); });

// public surface for tests / console: window.dashboard
window.exportParams = exportParams;
window.dashboard = {
  get params() { return params; },
  set(path, value) { setPath(params, path, value); syncInputs(path); renderAll(); },
  rows: () => state.rows, metrics: () => (state.ss && state.ss.metrics) || null, parity: () => state.parity,
  top: (n) => state.rows.filter(r => r.featured).sort((a, b) => a.featured_rank - b.featured_rank).slice(0, n || 12).map(r => r.slug),
  exportJSON: exportParamsJSON, importParams, resetParams, recompute: renderAll,
  fn: { computeFeatures, scoreShow, applyGates, rank, seesawMetrics, commonality, decay, logSaturate },
};

// boot
state.parity = parityCheck();
renderControls();
renderAll();
renderRuns();
renderJudge();
if (!SHOWS.length && !window.CURATION) $('#list').innerHTML = '<div class="notice">No data: open the generated <code>content/spend/reports/curation-&lt;city&gt;.html</code> (this file is the template).</div>';
</script>
</body>
</html>
