<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Curation Workshop</title>
<style>
/* ---- tokens: dark by default (webdemo house style), light via prefers-color-scheme ---- */
:root {
  color-scheme: dark;
  --bg: #0b0b0c; --surface: #161618; --surface-2: #1e1e21; --surface-3: #26262a;
  --text: #f3f3f1; --text-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
  --accent: #61adf2; --accent-soft: rgba(97,173,242,.16); --on-accent: #0b0b0c;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  /* categorical slots (dataviz reference palette, dark steps, validated on #161618) */
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --div-mid: #383835;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f9f9f7; --surface: #fcfcfb; --surface-2: #f0efec; --surface-3: #e6e5e0;
    --text: #0b0b0b; --text-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
    --accent: #1c6fc4; --accent-soft: rgba(42,120,214,.12); --on-accent: #fff;
    --good: #006300;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
    --div-mid: #f0efec;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 17px; font-weight: 650; margin: 0; }
h2 { font-size: 14px; font-weight: 650; margin: 18px 0 8px; }
h3 { font-size: 13px; font-weight: 650; margin: 14px 0 6px; color: var(--text-2); }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
button { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { background: var(--surface-3); }
button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
button.small { padding: 2px 7px; font-size: 12px; }
button.on { outline: 2px solid var(--accent); }
input, select { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 3px 6px; }
input[type=number] { width: 68px; text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { flex: 1; min-width: 60px; accent-color: var(--accent); padding: 0; background: transparent; border: 0; }
input[type=checkbox] { accent-color: var(--accent); }
.muted { color: var(--muted); }
.dim { color: var(--text-2); }
.num { font-variant-numeric: tabular-nums; }

/* ---- layout ---- */
header.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 18px; padding: 10px 18px; background: var(--bg); border-bottom: 1px solid var(--border); }
header .sub { color: var(--muted); font-size: 12px; margin-left: 10px; }
nav.tabs { display: flex; gap: 4px; }
nav.tabs button { background: transparent; border-color: transparent; color: var(--text-2); padding: 5px 12px; }
nav.tabs button.on { background: var(--accent-soft); color: var(--text); }
.hdr-kpis { margin-left: auto; display: flex; gap: 14px; font-size: 12px; color: var(--text-2); white-space: nowrap; }
.badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid var(--border); }
.badge.ok { background: rgba(12,163,12,.15); color: var(--good); border-color: rgba(12,163,12,.35); }
.badge.bad { background: rgba(208,59,59,.18); color: var(--crit); border-color: rgba(208,59,59,.45); }
.layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 18px; padding: 14px 18px 60px; }
aside#controls { position: sticky; top: 52px; align-self: start; max-height: calc(100vh - 66px); overflow: auto; padding-right: 4px; }
main { min-width: 0; }
.tab { display: none; }
.tab.on { display: block; }
@media (max-width: 1000px) {
  .layout { grid-template-columns: 1fr; }
  aside#controls { position: static; max-height: none; }
  .hdr-kpis { display: none; }
}

/* ---- controls ---- */
details.sec { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
details.sec > summary { cursor: pointer; padding: 7px 10px; font-weight: 600; font-size: 12.5px; list-style: none; display: flex; align-items: center; gap: 6px; }
details.sec > summary::before { content: "▸"; color: var(--muted); font-size: 10px; }
details.sec[open] > summary::before { content: "▾"; }
details.sec > .body { padding: 2px 10px 10px; }
.row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.row label { flex: 0 0 138px; font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
tr.rat td { background: var(--surface-2); }
.flip { color: var(--warn); font-weight: 600; }
.row.wide label { flex: 1 1 auto; }
.row select { flex: 1; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: 0 0 10px; }
.sw.hatch { background-image: repeating-linear-gradient(45deg, var(--c) 0 2px, transparent 2px 4px); background-color: color-mix(in srgb, var(--c) 30%, transparent); }
.hint { font-size: 11px; color: var(--muted); margin: 4px 0 2px; }
table.src { width: 100%; border-collapse: collapse; font-size: 12px; }
table.src td { padding: 2px 3px; border-top: 1px solid var(--border); vertical-align: middle; }
table.src input[type=number] { width: 56px; padding: 1px 4px; }
.srcwrap { max-height: 280px; overflow: auto; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.ovlist { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.ovlist .chip { cursor: pointer; }

/* ---- kpis ---- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; margin: 4px 0 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
.kpi .l { font-size: 11px; color: var(--muted); }
.kpi .v { font-size: 20px; font-weight: 600; line-height: 1.2; }
.kpi .d { font-size: 11px; color: var(--text-2); margin-top: 2px; }

/* ---- ranked list ---- */
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--text-2); margin: 6px 0 10px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; }
.card.feat { border-left: 3px solid var(--accent); }
.card.gated { opacity: .82; }
.card .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card .rank { font-variant-numeric: tabular-nums; color: var(--muted); width: 26px; flex: 0 0 26px; font-size: 12px; }
.card .ttl { font-weight: 600; }
.card .art { color: var(--text-2); }
.card .score { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
.chip { display: inline-block; padding: 0 6px; border-radius: 999px; font-size: 11px; line-height: 17px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); white-space: nowrap; }
.chip.venue { background: var(--surface-3); color: var(--text); }
.chip.f { background: var(--accent-soft); color: var(--text); border-color: transparent; font-weight: 600; }
.chip.warn { color: var(--warn); }
.chip.bad { color: var(--crit); }
.chip.pin { color: var(--accent); }
.chips { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.track { position: relative; height: 12px; background: var(--surface-2); border-radius: 3px; margin: 7px 0 5px 36px; }
.stack { position: absolute; left: 0; top: 0; height: 100%; display: flex; gap: 2px; }
.seg { height: 100%; background: var(--c); cursor: default; }
.seg.hatch { background-image: repeating-linear-gradient(45deg, var(--c) 0 3px, transparent 3px 6px); background-color: color-mix(in srgb, var(--c) 35%, transparent); }
.stack .seg:last-child { border-radius: 0 4px 4px 0; }
.seg:hover { filter: brightness(1.2); }
.thr { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--muted); }
.thr::after { content: "t"; position: absolute; top: -13px; left: -3px; font-size: 9px; color: var(--muted); }
.why { font-size: 12px; color: var(--text-2); margin-left: 36px; }
.lift { font-size: 12px; margin-left: 36px; color: var(--text-2); }
.lift b { color: var(--text); font-weight: 600; }
.card .foot { display: flex; gap: 8px; align-items: center; margin: 4px 0 0 36px; }
.cutoff { display: flex; align-items: center; gap: 10px; margin: 10px 0; color: var(--text-2); font-size: 12px; }
.cutoff::before, .cutoff::after { content: ""; flex: 1; border-top: 2px dashed var(--axis); }
.drawer { margin: 8px 0 2px 36px; padding-top: 8px; border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px 20px; font-size: 12px; }
.drawer h4 { margin: 0 0 4px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
table.t { border-collapse: collapse; width: 100%; font-size: 12px; }
table.t th { text-align: left; font-weight: 600; color: var(--muted); padding: 3px 6px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
table.t td { padding: 3px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; }
table.t tr.hi td { background: var(--accent-soft); }
.scroll { overflow-x: auto; max-width: 100%; }
.sig { padding: 4px 0; border-bottom: 1px solid var(--border); }
.sig .meta { color: var(--muted); font-size: 11px; }
.sig .snip { color: var(--text-2); }
.mini { display: flex; align-items: center; gap: 6px; font-size: 11px; }
.mini .lbl { flex: 0 0 120px; color: var(--text-2); }
.mini .bar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.mini .bar span { display: block; height: 100%; background: var(--s1); border-radius: 0 3px 3px 0; }
.mini .val { width: 22px; text-align: right; font-variant-numeric: tabular-nums; }
.rationale { color: var(--text-2); white-space: pre-wrap; }
.divbar { position: relative; height: 8px; width: 90px; background: var(--surface-2); border-radius: 2px; display: inline-block; vertical-align: middle; margin-right: 6px; }
.divbar::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--axis); }
.divbar span { position: absolute; top: 0; height: 100%; }
.divbar .up { background: var(--s1); left: 50%; border-radius: 0 3px 3px 0; }
.divbar .dn { background: var(--s8); right: 50%; border-radius: 3px 0 0 3px; }
.notice { background: var(--surface); border: 1px dashed var(--axis); border-radius: 8px; padding: 12px 14px; color: var(--text-2); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px 12px; margin-bottom: 14px; }
.panel h2 { margin-top: 2px; }
svg.sweep { width: 100%; height: auto; display: block; }
svg.sweep text { font: 10.5px system-ui, sans-serif; fill: var(--muted); }
svg.sweep .grid { stroke: var(--grid); stroke-width: 1; }
svg.sweep .axis { stroke: var(--axis); stroke-width: 1; }
svg.sweep .l1 { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg.sweep .l2 { fill: none; stroke: var(--s2); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg.sweep .cur { stroke: var(--accent); stroke-width: 1.5; }
svg.sweep .x { stroke: var(--text-2); stroke-width: 1; }
svg.sweep circle { stroke: var(--surface); stroke-width: 2; }
.lk { display: inline-block; width: 14px; height: 2px; vertical-align: middle; border-radius: 1px; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface-3); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 12px; max-width: 320px; white-space: pre-line; box-shadow: 0 4px 16px rgba(0,0,0,.35); }
#tip b { font-weight: 650; }
.slugline { font-size: 11px; color: var(--muted); }
.lint { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div><h1>Curation workshop</h1><span class="sub" id="hdr-meta"></span></div>
    <nav class="tabs" id="tabs">
      <button data-tab="ranking" class="on">Ranking</button>
      <button data-tab="benchmark">Benchmark</button>
      <button data-tab="runs">Runs</button>
      <button data-tab="judge">Judge</button>
    </nav>
    <div class="hdr-kpis" id="hdr-kpis"></div>
  </header>
  <div class="layout">
    <aside id="controls"></aside>
    <main>
      <section id="tab-ranking" class="tab on">
        <div class="kpis" id="kpis"></div>
        <div class="legend" id="legend"></div>
        <div id="list"></div>
        <div id="candidates"></div>
      </section>
      <section id="tab-benchmark" class="tab"></section>
      <section id="tab-runs" class="tab"></section>
      <section id="tab-judge" class="tab"></section>
    </main>
  </div>
  <div id="tip" hidden></div>
</div>
<!-- CURATION_DATA -->
<script>
'use strict';
<!-- CURATION_CORE -->

let params = normalizeParams(clone(R.params_default || {}));
const ui = { tab: 'ranking', hideCandidates: false, expanded: new Set(), snapshot: SEESAW.snapshot_id || null };
const state = { rows: [], ss: null, common: null, sweep: [], parity: null, cands: [] };
const PRESET_KEY = 'curation-presets:' + CITY;
const FILE_PRESETS = R.presets || {};   // content/curation/params/*.json, embedded at render time

function currentEntries() { return (ui.snapshot && ui.snapshot === SEESAW.snapshot_id) ? (SEESAW.entries || []) : []; }

function recompute() {
  state.rows = rank(SHOWS, params);
  state.ss = seesawMetrics(state.rows, currentEntries());
  state.common = commonality(state.rows, state.ss);
  state.sweep = currentEntries().length ? sweepData(state.rows, params, currentEntries()) : [];
  state.cands = candidateScores(params);
}
function renderAll() {
  recompute();
  renderHeader(); renderKPIs(); renderLegend(); renderList(); renderCandidates(); renderBenchmark();
}

// ---- helpers for rows ----
function cutoffInfo() {
  const feat = state.rows.filter(r => r.featured);
  if (!feat.length) return { row: null, score: +(params.threshold || 0), n: 0 };
  const row = feat.reduce((m, r) => (r.score < m.score ? r : m), feat[0]);
  return { row, score: row.score, n: feat.length };
}
// "what would lift it": gap to the cutoff show + the two features where this show lags it most
function liftHint(r) {
  const c = cutoffInfo();
  const w = params.weights || {};
  let gap, lags, basis;
  if (c.row && c.row.slug !== r.slug) {
    gap = c.row.score - r.score; basis = `cutoff show #${c.row.rank}`;
    lags = FEATURES.map(f => [f, c.row.contrib[f] - r.contrib[f]]).filter(x => x[1] > 1e-12).sort((a, b) => b[1] - a[1]).slice(0, 2);
  } else {
    gap = +(params.threshold || 0) - r.score; basis = 'threshold';
    lags = FEATURES.map(f => [f, +(w[f] ?? 0) * ((FEATURE_CAP[f] || 1) - r.features[f])]).filter(x => x[1] > 1e-12).sort((a, b) => b[1] - a[1]).slice(0, 2);
  }
  return { gap, lags, basis };
}
function liftHTML(r) {
  if (!r.gate || r.gate === 'excluded' || r.gate === 'out_of_window') return '';
  const { gap, lags, basis } = liftHint(r);
  if (gap <= 0) return `<div class="lift">above the cutoff score but gated: <b>${esc(r.gate_detail || r.gate)}</b></div>`;
  const lift = lags.length ? lags.map(([f, d]) => `${FEATURE_LABEL[f]} +${d.toFixed(2)}`).join(', ') : 'no single feature closes it';
  return `<div class="lift">gap to ${esc(basis)}: <b>${gap.toFixed(3)}</b> · what would lift it: <b>${esc(lift)}</b></div>`;
}
function chipsHTML(r) {
  const c = [];
  if (r.featured) c.push(`<span class="chip f">F${r.featured_rank}${r.editors_pick ? " · editors' pick" : ''}</span>`);
  if (r.pinned) c.push('<span class="chip pin">pinned</span>');
  if (r.gate === 'excluded') c.push('<span class="chip bad">excluded</span>');
  if (r.venue.is_museum) c.push('<span class="chip">museum</span>');
  if (r.venue.tier != null) c.push(`<span class="chip">tier ${esc(r.venue.tier)}</span>`);
  if (r.pool === 'pending') c.push('<span class="chip warn">pending</span>');
  if (!r.in_window) c.push('<span class="chip warn">out of window</span>');
  if (r.venue.neighborhood) c.push(`<span class="chip">${esc(r.venue.neighborhood)}</span>`);
  return c.join('');
}
function barHTML(r, scale) {
  const total = Math.max(0, r.score);
  let segs = '';
  for (const f of STACK_ORDER) {
    const v = r.contrib[f];
    if (!(v > 0)) continue;
    const [slot, hatch] = FEATURE_SLOT[f];
    const tip = `${FEATURE_LABEL[f]}: ${v.toFixed(3)}\nfeature ${r.features[f].toFixed(3)} × weight ${(+(params.weights[f] ?? 0)).toFixed(2)}`;
    segs += `<div class="seg${hatch ? ' hatch' : ''}" style="--c:var(--s${slot});flex:${v} 0 0" data-tip="${esc(tip)}"></div>`;
  }
  const w = scale > 0 ? Math.min(100, 100 * total / scale) : 0;
  const t = +(params.threshold || 0);
  const thr = (scale > 0 && t <= scale) ? `<div class="thr" style="left:${(100 * t / scale).toFixed(2)}%" data-tip="threshold ${t.toFixed(2)}"></div>` : '';
  return `<div class="track"><div class="stack" style="width:${w.toFixed(2)}%">${segs}</div>${thr}</div>`;
}
function miniBars(scores) {
  return Object.entries(scores || {}).map(([k, v]) => `<div class="mini"><span class="lbl">${esc(k.replace(/_/g, ' '))}</span><div class="bar"><span style="width:${Math.max(0, Math.min(100, 10 * (+v || 0)))}%"></span></div><span class="val">${esc(v)}</span></div>`).join('');
}
function drawerHTML(r) {
  const d = r._detail;
  let h = '<div class="drawer">';
  // contributions (the table-view twin of the stacked bar)
  h += '<div><h4>Score breakdown</h4><table class="t"><tr><th>feature</th><th class="n">value</th><th class="n">weight</th><th class="n">contrib</th></tr>';
  for (const f of STACK_ORDER) {
    const [slot, hatch] = FEATURE_SLOT[f];
    h += `<tr><td><span class="sw${hatch ? ' hatch' : ''}" style="--c:var(--s${slot});background-color:${hatch ? '' : `var(--s${slot})`}"></span> ${FEATURE_LABEL[f]}</td><td class="n">${fmt(r.features[f])}</td><td class="n">${fmt(params.weights[f], 2)}</td><td class="n">${fmt(r.contrib[f])}</td></tr>`;
  }
  h += `<tr><td><b>score</b></td><td></td><td></td><td class="n"><b>${fmt(r.score)}</b></td></tr></table>`;
  h += `<div class="hint">dates ${esc(r.dates && r.dates.start)} → ${esc(r.dates && r.dates.end)} · opened ${r.days_since_open} d ago · closes in ${r.days_to_close} d · ${r.n_images} images · ${r.desc_words} words · venue norm <code>${esc(r.venue.norm)}</code>${r.venue.id ? ` · id <code>${esc(r.venue.id)}</code>` : ''}</div></div>`;
  // signals grouped by source
  h += '<div><h4>Signals</h4>';
  if (!d.signals.length) h += '<div class="muted">no signals matched to this show</div>';
  else {
    const groups = {};
    for (const s of d.signals) { const sid = (s.source && s.source.id) || 'unknown'; (groups[sid] = groups[sid] || []).push(s); }
    for (const [sid, sigs] of Object.entries(groups)) {
      const src = SOURCE_BY_ID[sid] || {};
      const w = sourceWeight(sigs[0], params);
      h += `<div><b>${esc(src.name || sid)}</b> <span class="muted">${esc(sid)} · source weight ${fmt(w, 2)}${src.kind ? ' · ' + esc(src.kind) : ''}</span></div>`;
      for (const s of sigs) {
        const hl = ARTIST_KINDS.has(s.kind) ? +(params.half_life_days.artist ?? 180) : +(params.half_life_days.press ?? 21);
        const sw = signalWeight(s, params, hl);
        h += `<div class="sig"><div class="meta">${esc(s.date || '?')} · <b>${esc(s.kind)}</b> / ${esc(s.strength)} · sig weight ${fmt(sw)} (age ${signalAgeDays(s)} d)${s.n_rows > 1 ? ` · seen in ${s.n_rows} runs` : ''}${s.match_confidence != null ? ` · match ${esc(s.match_method)} ${fmt(s.match_confidence, 2)}` : ''}<br>run <code>${esc(s.run || '')}</code>${s.variant ? ' · ' + esc(s.variant) : ''}${s.model ? ' · ' + esc(s.model) : ''}</div>`;
        if (s.snippet) h += `<div class="snip">“${esc(s.snippet)}”</div>`;
        if (s.url) h += `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a>`;
        h += '</div>';
      }
    }
  }
  h += '</div>';
  // judge
  h += '<div><h4>Judge</h4>';
  const jv = r.judge || {};

function sweepSVG() {
  const pts = state.sweep;
  if (!pts.length) return '';
  const W = 640, H = 200, L = 34, Rm = 12, T = 12, B = 26;
  const x = t => L + t * (W - L - Rm), y = v => T + (1 - v) * (H - T - B);
  const path = key => { let d = '', pen = false; for (const p of pts) { if (p[key] == null) { pen = false; continue; } d += (pen ? 'L' : 'M') + x(p.t).toFixed(1) + ' ' + y(p[key]).toFixed(1); pen = true; } return d; };
  const t = +(params.threshold || 0);
  let g = '';
  for (const v of [0, 0.25, 0.5, 0.75, 1]) g += `<line class="${v === 0 ? 'axis' : 'grid'}" x1="${L}" x2="${W - Rm}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`;
  for (const v of [0, 0.25, 0.5, 0.75, 1]) g += `<text x="${x(v)}" y="${H - 8}" text-anchor="middle">${v.toFixed(2)}</text>`;
  const cur = t <= 1 ? `<line class="cur" x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${H - B}"/><text x="${x(t) + 4}" y="${T + 9}">t = ${t.toFixed(2)}</text>` : '';
  return `<div class="legend"><span><span class="lk" style="background:var(--s1)"></span>precision</span><span><span class="lk" style="background:var(--s2)"></span>recall</span><span class="muted">threshold sweep 0 → 1 at the current weights · hover for values</span></div>
  <svg class="sweep" viewBox="0 0 ${W} ${H}" id="sweep">${g}<path class="l1" d="${path('precision')}"/><path class="l2" d="${path('recall')}"/>${cur}<g id="sweep-hover"></g><rect x="${L}" y="${T}" width="${W - L - Rm}" height="${H - T - B}" fill="transparent" id="sweep-hit"/></svg>`;
}
function liftBar(lift) {
  if (lift == null) return '<span class="divbar"></span>';

}

function wireSweep() {
  const svg = $('#sweep'); if (!svg) return;
  const hit = $('#sweep-hit'), hov = $('#sweep-hover');
  const W = 640, H = 200, L = 34, Rm = 12, T = 12, B = 26;
  const x = t => L + t * (W - L - Rm), y = v => T + (1 - v) * (H - T - B);
  hit.addEventListener('mousemove', e => {
    const bb = svg.getBoundingClientRect();
    const t = Math.max(0, Math.min(1, ((e.clientX - bb.left) / bb.width * W - L) / (W - L - Rm)));
    const p = state.sweep[Math.round(t * 100)];
    if (!p) return;
    hov.innerHTML = `<line class="x" x1="${x(p.t)}" x2="${x(p.t)}" y1="${T}" y2="${H - B}"/>` + (p.precision == null ? '' : `<circle cx="${x(p.t)}" cy="${y(p.precision)}" r="4" fill="var(--s1)"/>`) + (p.recall == null ? '' : `<circle cx="${x(p.t)}" cy="${y(p.recall)}" r="4" fill="var(--s2)"/>`);
    showTip(`threshold ${p.t.toFixed(2)} · ${p.n_top} featured\nprecision ${fmt(p.precision, 2)} · recall ${fmt(p.recall, 2)} · jaccard ${fmt(p.jaccard, 2)}`, e);
  });
  hit.addEventListener('mouseleave', () => { hov.innerHTML = ''; hideTip(); });
  hit.addEventListener('click', e => {
    const bb = svg.getBoundingClientRect();
    const t = Math.max(0, Math.min(1, ((e.clientX - bb.left) / bb.width * W - L) / (W - L - Rm)));
    params.threshold = Math.round(t * 100) / 100; syncInputs('threshold'); renderAll();
  });
}

  for (const [k, t] of Object.entries(tot)) h += `<tr><td>${esc(k)}</td><td>${esc([...t.models].join(', '))}</td><td class="n">${t.runs}</td><td class="n">${t.signals}</td><td class="n">${t.cands}</td><td class="n">${t.searches}</td><td class="n">${fmt(t.cost, 3)}</td><td class="n">${t.signals ? fmt(t.cost / t.signals, 3) : '–'}</td><td class="n">${fmt(t.dur, 0)}</td></tr>`;

// ---- judge tab ----
function judgeCell(v) {
  if (v == null) return '<span class="muted">–</span>';
  if (typeof v === 'boolean') return v ? '✓' : '–';
  if (typeof v === 'number') return `<span class="num">${Number.isInteger(v) ? v : fmt(v, 3)}</span>`;
  if (Array.isArray(v)) return esc(v.map(x => (typeof x === 'object' ? JSON.stringify(x) : x)).join(', '));
  if (typeof v === 'object') {
    const vals = Object.values(v);
    if (vals.length && vals.every(x => typeof x === 'number')) return miniBars(v);
    return `<code>${esc(JSON.stringify(v))}</code>`;
  }
  const s = String(v);
  return s.length > 60 ? `<div class="rationale" style="min-width:260px">${esc(s)}</div>` : esc(s);
}
function judgeTable(rows) {
  if (!Array.isArray(rows) || !rows.length) return '<div class="muted">empty</div>';
  const cols = []; for (const r of rows) for (const k of Object.keys(r)) if (!cols.includes(k)) cols.push(k);
  let h = '<div class="scroll"><table class="t"><tr>' + cols.map(c => `<th>${esc(c)}</th>`).join('') + '</tr>';
  for (const r of rows) h += '<tr>' + cols.map(c => `<td>${c === 'slug' && r[c] ? `<a href="#row-${esc(r[c])}" data-act="goto" data-slug="${esc(r[c])}"><code>${esc(r[c])}</code></a>` : judgeCell(r[c])}</td>`).join('') + '</tr>';
  return h + '</table></div>';
}
// judge.py compare shape: {variant, n, spearman, mean_abs_delta, precision_at_n{sonnet,opus,mean}, overlap{},

// rows: {slug, title, artist, venue, sonnet{scores,overall,confidence,rationale,red_flags,cost_usd}, opus{…},
//   delta, max_sub_delta, membership{sonnet,opus,mean}, membership_flip, on_seesaw, seesaw_flip, rank{…}, cutoff_proximity, relevance}
function verdictCell(v) {
  if (!v) return '<span class="muted">no verdict</span>';

}
function triCell(o, fmtFn) {

}
const yesNo = v => v === true ? '✓' : (v === false ? '–' : esc(v ?? '–'));
function judgeSpecific(jc) {
  const p = jc.precision_at_n || {}, ov = jc.overlap || {}, cpv = jc.cost_per_verdict || {};

    kpi('Spearman ρ', fmt(jc.spearman, 2), 'rank agreement, sonnet vs opus') + kpi('Mean |Δ|', fmt(jc.mean_abs_delta, 2), 'opus − sonnet overall, /10') +
    kpi('Precision@N', `<span style="font-size:15px">${fmt(p.sonnet, 2)} / ${fmt(p.opus, 2)} / ${fmt(p.mean, 2)}</span>`, `sonnet / opus / mean vs See Saw, top ${esc(jc.n_top ?? '')}`) +
    kpi('Top-N overlap', `<span style="font-size:15px">${esc(ov.sonnet ?? '–')} / ${esc(ov.opus ?? '–')} / ${esc(ov.mean ?? '–')}</span>`, 'sonnet / opus / mean') +
    kpi('$ / verdict', `<span style="font-size:15px">${fmt(cpv.sonnet, 3)} / ${fmt(cpv.opus, 3)}</span>`, `sonnet / opus · $${fmt(jc.total_cost_compared, 3)} compared, $${fmt(jc.total_cost_variant, 3)} variant total`) +
    kpi('Auto-suggestion', `<span style="font-size:15px">${esc(jc.suggestion || '–')}</span>`, esc(jc.suggestion_basis || '') + ' · starting point only; read the rationales') + '</div>';
  if (R.judge_compare_source) h += `<div class="hint">embedded from <code>${esc(R.judge_compare_source)}</code> · generated ${esc(jc.generated_at || '')}</div>`;
  const top = jc.top || [];
  h += `<div class="panel"><h2>Top ${top.length} decision-relevant comparisons</h2><div class="hint">relevance = |Δ| + 3·membership flip + 4·See Saw flip + 0.5·max sub-score Δ + 0.5·cutoff proximity. Rows with a flip are highlighted; rationales side by side underneath.</div><div class="scroll"><table class="t"><tr><th class="n">#</th><th>show</th><th>claude-sonnet-5</th><th>claude-opus-5</th><th class="n">Δ overall</th><th class="n">max sub Δ</th><th>in top-N</th><th>rank</th><th>See Saw</th><th class="n">cutoff prox.</th><th class="n">relevance</th></tr>`;
  top.forEach((r, i) => {
    const flip = r.membership_flip || r.seesaw_flip;
    h += `<tr class="${flip ? 'hi' : ''}"><td class="n">${i + 1}</td><td><a href="#row-${esc(r.slug)}" data-act="goto" data-slug="${esc(r.slug)}"><b>${esc(r.title || r.slug)}</b></a><div class="muted">${esc(r.artist || '')}${r.artist ? ' · ' : ''}${esc(r.venue || '')}</div><div class="slugline"><code>${esc(r.slug)}</code></div></td><td>${verdictCell(r.sonnet)}</td><td>${verdictCell(r.opus)}</td><td class="n">${r.delta > 0 ? '+' : ''}${esc(r.delta ?? '–')}</td><td class="n">${esc(r.max_sub_delta ?? '–')}</td><td>${triCell(r.membership, yesNo)}${r.membership_flip ? ' <span class="flip">flip</span>' : ''}</td><td>${triCell(r.rank, v => esc(v ?? '–'))}</td><td>${yesNo(r.on_seesaw)}${r.seesaw_flip ? ' <span class="flip">flip</span>' : ''}</td><td class="n">${fmt(r.cutoff_proximity, 3)}</td><td class="n">${fmt(r.relevance, 2)}</td></tr>`;

  h += '</table></div></div>';

}
function renderJudge() {
  const el = $('#tab-judge');
  const jc = R.judge_compare;
  if (jc && Array.isArray(jc.top) && jc.top.length && jc.top[0] && (jc.top[0].sonnet || jc.top[0].opus)) { el.innerHTML = judgeSpecific(jc); return; }
  if (!jc || !Object.keys(jc).length) {
    el.innerHTML = `<div class="notice"><b>No judge comparison yet.</b><br>Generate it with<br><code>scraper/.venv/bin/python scraper/judge.py run --city ${esc(CITY)} --models claude-sonnet-5,claude-opus-5</code><br><code>scraper/.venv/bin/python scraper/judge.py compare --city ${esc(CITY)}</code><br>then <code>curate.py score --city ${esc(CITY)}</code> and <code>curation_dashboard.py --city ${esc(CITY)}</code>. The dashboard embeds <code>content/curation/${esc(CITY)}/judge_compare.json</code> automatically when it exists.</div>`;
    return;
  }
  let h = '';
  const scalars = {};
  const summary = jc.summary || jc.header || jc.stats || {};
  for (const [k, v] of Object.entries(Object.assign({}, jc, summary))) if (v == null || ['number', 'string', 'boolean'].includes(typeof v)) scalars[k] = v;
  if (Object.keys(scalars).length) h += '<div class="kpis">' + Object.entries(scalars).map(([k, v]) => kpi(k.replace(/_/g, ' '), typeof v === 'number' ? fmt(v, 3) : `<span style="font-size:13px">${esc(String(v))}</span>`)).join('') + '</div>';
  if (R.judge_compare_source) h += `<div class="hint">embedded from <code>${esc(R.judge_compare_source)}</code></div>`;
  const top = jc.top || jc.top10 || jc.top_rows || jc.decision_relevant || (Array.isArray(jc.rows) ? jc.rows.slice(0, 10) : null);
  const all = jc.rows || jc.all || jc.agreement || jc.shows || jc.per_show;
  if (jc.recommendation || jc.suggestion) h += `<div class="panel"><h2>Recommendation</h2><div class="rationale">${esc(jc.recommendation || jc.suggestion)}</div></div>`;
  if (top) h += `<div class="panel"><h2>Top ${top.length} decision-relevant comparisons</h2>${judgeTable(top)}</div>`;
  if (all && all !== top) h += `<div class="panel"><h2>Full agreement table (${all.length})</h2>${judgeTable(all)}</div>`;
  for (const [k, v] of Object.entries(jc)) if (Array.isArray(v) && v !== top && v !== all && v.length && typeof v[0] === 'object') h += `<div class="panel"><h2>${esc(k)}</h2>${judgeTable(v)}</div>`;
  el.innerHTML = h || '<div class="notice">judge_compare present but empty.</div>';
}

function syncInputs(path, except) {
  const v = getPath(params, path);
  document.querySelectorAll(`[data-path="${path}"]`).forEach(el => {
    if (el === except) return;
    if (el.type === 'checkbox') el.checked = !!v;
    else el.value = v == null ? '' : v;
  });
}
function readInput(el) {
  const kind = el.dataset.kind;
  if (kind === 'bool') return !!el.checked;
  if (kind === 'str') return el.value;
  if (el.value === '' || el.value == null) return kind === 'nullnum' ? null : 0;
  const n = kind === 'int' ? parseInt(el.value, 10) : parseFloat(el.value);
  return Number.isNaN(n) ? (kind === 'nullnum' ? null : 0) : n;
}
function onControlInput(e) {
  const el = e.target;
  if (el.dataset && el.dataset.path) {
    setPath(params, el.dataset.path, readInput(el));
    syncInputs(el.dataset.path, el);
    renderAll();
  } else if (el.dataset && el.dataset.src) {
    const id = el.dataset.src;
    const cur = effSource(id);
    params.sources[id] = { enabled: cur.enabled, weight: cur.weight };
    if (el.dataset.field === 'enabled') params.sources[id].enabled = !!el.checked;
    else params.sources[id].weight = parseFloat(el.value) || 0;
    renderAll();
  } else if (el.id === 'hide-cands') {
    ui.hideCandidates = !!el.checked; renderCandidates();
  }
}

// ---- presets / export / import ----
function loadPresets() { try { return JSON.parse(localStorage.getItem(PRESET_KEY) || '{}') || {}; } catch (e) { return {}; } }
function savePresets(p) { try { localStorage.setItem(PRESET_KEY, JSON.stringify(p)); } catch (e) { alert('localStorage unavailable: ' + e.message); } }
function exportParams() { return orderedParams(clone(params)); }
function exportParamsJSON() { return JSON.stringify(exportParams(), null, 2); }
function downloadParams() {
  const blob = new Blob([exportParamsJSON()], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `params-${CITY}-${(R.today || 'today')}.json`;
  document.body.appendChild(a); a.click(); a.remove();

}

// ---- global wiring ----
function toggleOverride(kind, slug) {
  const list = params.overrides[kind];
  const i = list.indexOf(slug);
  if (i >= 0) list.splice(i, 1); else list.push(slug);
  if (kind === 'pin') { const j = params.overrides.exclude.indexOf(slug); if (i < 0 && j >= 0) params.overrides.exclude.splice(j, 1); }
  if (kind === 'exclude') { const j = params.overrides.pin.indexOf(slug); if (i < 0 && j >= 0) params.overrides.pin.splice(j, 1); }
  $('#overrides').innerHTML = overridesHTML();
  renderAll();
}
function gotoRow(slug) {
  ui.expanded.add(slug);
  showTab('ranking'); renderList();
  const el = document.getElementById('row-' + slug); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function showTab(name) {
  ui.tab = name;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  document.querySelectorAll('.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + name));
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) { const t = e.target.closest('nav.tabs button'); if (t) showTab(t.dataset.tab); return; }
  const act = b.dataset.act;
  if (act === 'toggle') { const s = b.dataset.slug; if (ui.expanded.has(s)) ui.expanded.delete(s); else ui.expanded.add(s); renderList(); }
  else if (act === 'pin' || act === 'exclude') toggleOverride(act, b.dataset.slug);
  else if (act === 'rm-override') toggleOverride(b.dataset.kind, b.dataset.slug);
  else if (act === 'goto') { e.preventDefault(); gotoRow(b.dataset.slug); }
  else if (act === 'goto-cand') { e.preventDefault(); ui.hideCandidates = false; const cb = $('#hide-cands'); if (cb) cb.checked = false; showTab('ranking'); renderCandidates(); const el = document.getElementById('cand-' + b.dataset.key); if (el) el.scrollIntoView({ block: 'center' }); }
  else if (act === 'export') downloadParams();
  else if (act === 'import-click') $('#import-file').click();
  else if (act === 'reset') resetParams();
  else if (act === 'preset-save') { const name = ($('#preset-name').value || '').trim(); if (!name) { alert('name the preset first'); return; } const p = loadPresets(); p[name] = exportParams(); savePresets(p); $('#controls').querySelector('details.sec:last-of-type .body').innerHTML = presetsHTML(); $('#preset-sel').value = 'local:' + name; }
  else if (act === 'preset-load') { const sel = $('#preset-sel').value; if (!sel) return; const i = sel.indexOf(':'), kind = sel.slice(0, i), name = sel.slice(i + 1);
    const obj = kind === 'file' ? (FILE_PRESETS[name] || {}).params : loadPresets()[name];
    if (obj) importParams(obj); }
  else if (act === 'preset-del') { const sel = $('#preset-sel').value; if (!sel) return; const i = sel.indexOf(':'), kind = sel.slice(0, i), name = sel.slice(i + 1);
    if (kind === 'file') { alert(`"${name}" is a file preset (${(FILE_PRESETS[name] || {}).file}) — delete it on disk, not here.`); return; }
    const p = loadPresets(); delete p[name]; savePresets(p); $('#controls').querySelector('details.sec:last-of-type .body').innerHTML = presetsHTML(); }
});
document.addEventListener('input', e => { if (e.target.closest('#controls')) onControlInput(e); });
document.addEventListener('change', e => {
  if (e.target.id === 'import-file') {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { importParams(JSON.parse(rd.result)); } catch (err) { alert('import failed: ' + err.message); } };
    rd.readAsText(f); e.target.value = '';
  } else if (e.target.id === 'snap-sel') { ui.snapshot = e.target.value || null; renderAll(); }
  else if (e.target.closest('#controls') && (e.target.type === 'checkbox' || e.target.tagName === 'SELECT')) { /* input already handled */ }
});

// tooltip
const tipEl = $('#tip');
function showTip(text, e) { tipEl.textContent = text; tipEl.hidden = false; moveTip(e); }
function hideTip() { tipEl.hidden = true; }
function moveTip(e) { const x = Math.min(e.clientX + 14, window.innerWidth - 330), y = e.clientY + 16; tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px'; }
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el.dataset.tip, e); else if (!e.target.closest('#sweep')) hideTip(); });
document.addEventListener('mousemove', e => { if (!tipEl.hidden && e.target.closest('[data-tip]')) moveTip(e); });

// public surface for tests / console: window.dashboard
window.exportParams = exportParams;
window.dashboard = {
  get params() { return params; },
  set(path, value) { setPath(params, path, value); syncInputs(path); renderAll(); },
  rows: () => state.rows, metrics: () => (state.ss && state.ss.metrics) || null, parity: () => state.parity,
  top: (n) => state.rows.filter(r => r.featured).sort((a, b) => a.featured_rank - b.featured_rank).slice(0, n || 12).map(r => r.slug),
  exportJSON: exportParamsJSON, importParams, resetParams, recompute: renderAll,
  fn: { computeFeatures, scoreShow, applyGates, rank, seesawMetrics, commonality, decay, logSaturate },
};

// boot
state.parity = parityCheck();
renderControls();
renderAll();
renderRuns();
renderJudge();
if (!SHOWS.length && !window.CURATION) $('#list').innerHTML = '<div class="notice">No data: open the generated <code>content/spend/reports/curation-&lt;city&gt;.html</code> (this file is the template).</div>';
</script>
</body>
</html>
